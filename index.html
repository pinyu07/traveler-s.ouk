<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日系手帳風旅遊與分帳 App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        picturebook: {
                            bg: '#FFFDF9', card: '#FFFFFF', cream: '#FFF7E6', matcha: '#859F7A',
                            sakura: '#E8A5A5', mustard: '#E0A949', sky: '#81A3BD',
                            lightYellow: '#FDF6E2', lightBlue: '#E6F0F7', ink: '#4A3E3D',
                            muted: '#A0938E', border: '#E8E1D7'
                        }
                    },
                    fontFamily: { hand: ['"Zen Maru Gothic"', 'sans-serif'], title: ['"Mochiy Pop One"', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { background-color: #FFFDF9; color: #4A3E3D; font-family: 'Zen Maru Gothic', sans-serif; -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .hand-card { border-radius: 18px 14px 20px 16px; border: 2px solid #E8E1D7; box-shadow: 3px 3px 0px #E8E1D7; }
        .hand-card-sm { border-radius: 14px 12px 15px 11px; border: 2px solid #E8E1D7; }
        .hand-btn { border-radius: 12px 14px 11px 13px; box-shadow: 2px 2px 0px #4A3E3D; transition: all 0.1s ease; }
        .hand-btn:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0px #4A3E3D; }
        .tab-active { color: #81A3BD; border-bottom: 3px solid #81A3BD; font-weight: 700; }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen flex flex-col justify-between relative shadow-2xl bg-picturebook-bg">

    <!-- Header -->
    <header class="bg-gradient-to-r from-picturebook-lightYellow via-picturebook-cream to-picturebook-lightBlue text-picturebook-ink p-5 rounded-b-[28px] shadow-sm relative overflow-hidden border-b-2 border-picturebook-border">
        <div class="flex justify-between items-start relative z-10">
            <div class="w-full">
                <div class="flex items-center justify-between">
                    <span id="trip-dest-badge" class="bg-white/80 text-picturebook-ink text-xs px-3 py-1 rounded-full font-bold border border-picturebook-border shadow-sm">🇯🇵 東京/日本</span>
                    <div class="flex gap-1.5">
                        <!--  স্পষ্ট的編輯按鈕 -->
                        <button onclick="openTripTitleEditModal()" class="text-[11px] bg-white text-picturebook-sky px-2.5 py-1 hand-btn font-bold border border-picturebook-border flex items-center gap-1">
                            <i class="fa-solid fa-pen"></i> 更改標題
                        </button>
                        <button onclick="shareTripUrl()" class="text-[10px] bg-picturebook-matcha text-white px-2.5 py-1 hand-btn font-bold">
                            <i class="fa-solid fa-share-nodes mr-1"></i>分享
                        </button>
                    </div>
                </div>
                
                <div class="mt-2">
                    <h1 id="trip-title" class="text-2xl font-title text-picturebook-ink">關東秋季自由行 🍁</h1>
                </div>
                
                <p id="trip-dates-text" onclick="openTripDatesEditModal()" class="text-xs text-picturebook-muted mt-1 font-bold cursor-pointer hover:text-picturebook-sky transition inline-block">
                    <i class="fa-regular fa-calendar-check mr-1 text-picturebook-sky"></i>2026/10/15 - 2026/10/19 (5天) <i class="fa-solid fa-pen-to-square text-[10px] ml-1"></i>
                </p>
            </div>
        </div>
    </header>

    <!-- Day Slider -->
    <div class="px-4 mt-3">
        <div id="day-slider" class="flex gap-2 overflow-x-auto hide-scrollbar py-1"></div>
    </div>

    <!-- Main Content -->
    <main class="flex-1 px-4 py-2 pb-24 overflow-y-auto">
        <!-- TAB 1: ITINERARY -->
        <div id="tab-itinerary" class="tab-content space-y-3">
            <div class="flex justify-between items-center px-1 pt-1">
                <h2 class="font-bold text-picturebook-ink text-sm"><i class="fa-solid fa-list-ul text-picturebook-sky mr-1.5"></i>行程時間軸</h2>
                <button onclick="openAddItemModal()" class="text-xs bg-picturebook-sky text-white px-3.5 py-2 hand-btn font-bold">✏️ 新增行程</button>
            </div>
            <div class="relative pl-8 pt-3 space-y-4">
                <div class="absolute left-[15px] top-4 bottom-4 w-0 border-l-2 border-dashed border-picturebook-muted/50 z-0"></div>
                <div id="timeline-list" class="space-y-4 relative z-10"></div>
            </div>
        </div>

        <!-- TAB 2: SPOTS -->
        <div id="tab-spots" class="tab-content hidden space-y-3">
            <div class="flex justify-between items-center mb-1">
                <h2 class="font-bold text-picturebook-ink text-sm"><i class="fa-solid fa-map-location-dot text-picturebook-mustard mr-1.5"></i>景點地圖</h2>
                <button onclick="openAddSpotModal()" class="text-xs bg-picturebook-mustard text-white px-3 py-1.5 hand-btn font-bold">+ 新增景點</button>
            </div>
            <div id="spots-list" class="grid grid-cols-2 gap-2.5"></div>
        </div>

        <!-- TAB 3: EXPENSES -->
        <div id="tab-expenses" class="tab-content hidden space-y-3">
            <div class="bg-picturebook-card p-3.5 hand-card">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs font-bold text-picturebook-ink"><i class="fa-solid fa-user-group text-picturebook-sakura mr-1.5"></i>旅途好夥伴</span>
                    <button onclick="manageCompanions()" class="text-[11px] text-picturebook-sakura font-bold underline">編輯夥伴</button>
                </div>
                <div id="companions-chips" class="flex flex-wrap gap-1.5 text-xs"></div>
            </div>
            <div class="bg-picturebook-card hand-card p-4">
                <div class="flex justify-between items-center mb-2.5">
                    <span class="text-xs font-bold text-picturebook-ink"><i class="fa-solid fa-scale-balanced text-picturebook-sky mr-1.5"></i>全團結算清單</span>
                    <button onclick="calculateSettlement()" class="text-[11px] bg-picturebook-sky text-white px-2.5 py-1 hand-btn font-bold">重新計算</button>
                </div>
                <div id="settlement-breakdown" class="text-xs space-y-1.5 mb-3 pb-2.5 border-b border-picturebook-border text-picturebook-ink"></div>
                <div id="settlement-actions" class="text-xs space-y-2 font-bold"></div>
            </div>
            <div class="flex justify-between items-center pt-1">
                <h3 class="text-xs font-bold text-picturebook-ink">📝 消費明細筆記</h3>
                <button onclick="openAddExpenseModal()" class="bg-picturebook-sakura text-white text-xs px-3 py-1.5 hand-btn font-bold">+ 手動記一筆</button>
            </div>
            <div id="expenses-list" class="space-y-2.5"></div>
        </div>

        <!-- TAB 4: CHECKLIST -->
        <div id="tab-checklist" class="tab-content hidden space-y-3">
            <div class="bg-picturebook-card p-3.5 hand-card">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-xs font-bold text-picturebook-ink"><i class="fa-solid fa-square-check text-picturebook-matcha mr-1.5"></i>出發打包檢查表</h3>
                    <button onclick="addChecklistItem()" class="text-xs bg-picturebook-matcha text-white px-3 py-1.5 hand-btn font-bold">+ 新增物品</button>
                </div>
                <div id="checklist-items" class="space-y-2 text-xs"></div>
            </div>
        </div>
    </main>

    <!-- Modal: Itinerary Add/Edit -->
    <div id="modal-add-item" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-picturebook-card w-full max-w-sm p-4 hand-card space-y-3">
            <div class="flex justify-between items-center border-b border-picturebook-border pb-2">
                <h3 id="modal-itinerary-title" class="font-bold text-sm text-picturebook-ink">✏️ 新增行程與交通</h3>
                <button onclick="closeAddItemModal()" class="text-picturebook-muted text-lg">✕</button>
            </div>
            <div>
                <label class="text-[11px] font-bold text-picturebook-muted block mb-1">選擇圖示類別：</label>
                <div id="category-selector" class="grid grid-cols-4 gap-2 text-xs"></div>
            </div>
            <div>
                <label class="text-[11px] font-bold text-picturebook-muted block mb-1">行程標題/地點：</label>
                <input id="input-item-title" type="text" placeholder="例如: 淺草寺散策" class="w-full text-xs p-2 rounded-xl border border-picturebook-border focus:outline-none">
            </div>
            <div class="flex gap-2">
                <div class="w-1/2">
                    <label class="text-[11px] font-bold text-picturebook-muted block mb-1">預計時間：</label>
                    <input id="input-item-time" type="time" value="10:00" class="w-full text-xs p-2 rounded-xl border border-picturebook-border focus:outline-none bg-white font-bold">
                </div>
                <div class="w-1/2">
                    <label class="text-[11px] font-bold text-picturebook-muted block mb-1">備註：</label>
                    <input id="input-item-note" type="text" placeholder="備註或注意事項" class="w-full text-xs p-2 rounded-xl border border-picturebook-border focus:outline-none">
                </div>
            </div>
            <button onclick="saveItineraryItem()" class="w-full bg-picturebook-sky text-white py-2 hand-btn font-bold text-xs mt-2">儲存行程</button>
        </div>
    </div>

    <!-- Bottom Nav -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-picturebook-card border-t-2 border-picturebook-border flex justify-around py-2.5 px-2 z-30 shadow-lg rounded-t-[20px]">
        <button onclick="switchTab('itinerary')" id="nav-itinerary" class="flex flex-col items-center text-picturebook-sky tab-active">
            <i class="fa-solid fa-book-open text-lg"></i><span class="text-[10px] mt-0.5 font-bold">行程</span>
        </button>
        <button onclick="switchTab('spots')" id="nav-spots" class="flex flex-col items-center text-picturebook-muted">
            <i class="fa-solid fa-compass text-lg"></i><span class="text-[10px] mt-0.5 font-bold">景點</span>
        </button>
        <button onclick="switchTab('expenses')" id="nav-expenses" class="flex flex-col items-center text-picturebook-muted">
            <i class="fa-solid fa-coins text-lg"></i><span class="text-[10px] mt-0.5 font-bold">記帳分帳</span>
        </button>
        <button onclick="switchTab('checklist')" id="nav-checklist" class="flex flex-col items-center text-picturebook-muted">
            <i class="fa-solid fa-list-check text-lg"></i><span class="text-[10px] mt-0.5 font-bold">準備清單</span>
        </button>
    </nav>

    <script>
        const CATEGORIES = [
            { name: "美食", icon: "🍱", bg: "bg-picturebook-sakura/20 text-picturebook-sakura" },
            { name: "觀光", icon: "⛩️", bg: "bg-picturebook-mustard/20 text-picturebook-mustard" },
            { name: "交通", icon: "🚃", bg: "bg-picturebook-sky/20 text-picturebook-sky" },
            { name: "購物", icon: "🛍️", bg: "bg-picturebook-sakura/20 text-picturebook-sakura" },
            { name: "其他", icon: "🎈", bg: "bg-picturebook-cream text-picturebook-ink" }
        ];

        let selectedCategory = CATEGORIES[0];
        let editingItemId = null;
        let appData = {
            title: "關東秋季自由行 🍁", destination: "東京/日本", startDate: "2026-10-15", totalDays: 5,
            fxCode: "JPY", fxRate: 0.210, companions: ["我", "夥伴A", "夥伴B"], selectedDay: 1,
            itinerary: [
                { id: 1, day: 1, time: "09:00", title: "抵達羽田機場", icon: "🚃", tag: "交通", tagBg: "bg-picturebook-sky/20 text-picturebook-sky", note: "搭乘單軌電車", completed: false }
            ],
            spots: [{ id: 1, name: "SHIBUYA SKY", desc: "看夜景" }],
            expenses: [{ id: 1, title: "門票", amount: 12000, payer: "夥伴A", sharedBy: ["我", "夥伴A"] }],
            checklist: [{ id: 1, text: "護照與簽證文件", checked: true }]
        };

        window.addEventListener('DOMContentLoaded', () => {
            loadLocalData();
            renderHeader();
            renderDaysSlider();
            renderItinerary();
            renderSpots();
            renderCompanions();
            renderExpenses();
            renderChecklist();
            calculateSettlement();
            renderCategorySelector();
        });

        function saveData() { localStorage.setItem('picturebook_travel_app_v13', JSON.stringify(appData)); }
        function loadLocalData() {
            const saved = localStorage.getItem('picturebook_travel_app_v13');
            if (saved) { try { appData = JSON.parse(saved); } catch (e) {} }
        }

        function shareTripUrl() {
            const jsonStr = JSON.stringify(appData);
            const base64Data = btoa(encodeURIComponent(jsonStr));
            const shareUrl = `${window.location.origin}${window.location.pathname}#data=${base64Data}`;
            navigator.clipboard.writeText(shareUrl).then(() => alert('🔗 完整共用網址已複製！'));
        }

        function renderHeader() {
            document.getElementById('trip-title').innerText = appData.title;
            document.getElementById('trip-dest-badge').innerText = `🇯🇵 ${appData.destination}`;
            const start = new Date(appData.startDate);
            const end = new Date(start);
            end.setDate(start.getDate() + (appData.totalDays - 1));
            document.getElementById('trip-dates-text').innerHTML = `<i class="fa-regular fa-calendar-check mr-1 text-picturebook-sky"></i>${start.getFullYear()}/${start.getMonth()+1}/${start.getDate()} - ${end.getFullYear()}/${end.getMonth()+1}/${end.getDate()} (${appData.totalDays}天) <i class="fa-solid fa-pen-to-square text-[10px] ml-1"></i>`;
        }

        // 💡 獨立明顯的「更改標題」按鈕觸發函式
        function openTripTitleEditModal() {
            const title = prompt("請輸入新的旅程名稱:", appData.title);
            if (title !== null && title.trim() !== "") {
                appData.title = title.trim();
            }
            const dest = prompt("請輸入新的目的地 (例如: 大阪/日本):", appData.destination);
            if (dest !== null && dest.trim() !== "") {
                appData.destination = dest.trim();
            }
            saveData();
            renderHeader();
        }

        function openTripDatesEditModal() {
            const startDate = prompt("請輸入開始日期 (格式 YYYY-MM-DD):", appData.startDate);
            if (startDate !== null && startDate.trim() !== "") appData.startDate = startDate.trim();
            const days = parseInt(prompt("請輸入總天數:", appData.totalDays));
            if (!isNaN(days) && days > 0) appData.totalDays = days;
            saveData();
            renderHeader();
            renderDaysSlider();
            renderItinerary();
        }

        function renderDaysSlider() {
            const slider = document.getElementById('day-slider');
            slider.innerHTML = '';
            for (let i = 1; i <= appData.totalDays; i++) {
                const dayDate = new Date(appData.startDate);
                dayDate.setDate(dayDate.getDate() + (i - 1));
                const dateStr = `${dayDate.getMonth()+1}/${dayDate.getDate()}`;
                const isActive = appData.selectedDay === i;
                const btn = document.createElement('button');
                btn.className = `flex-shrink-0 px-3.5 py-1.5 hand-card-sm text-center transition ${isActive ? 'bg-picturebook-sky text-white font-bold border-picturebook-sky shadow-sm' : 'bg-picturebook-card text-picturebook-ink'}`;
                btn.onclick = () => { appData.selectedDay = i; renderDaysSlider(); renderItinerary(); };
                btn.innerHTML = `<div class="text-[10px] ${isActive ? 'text-white/90' : 'text-picturebook-muted'}">Day ${i}</div><div class="text-xs font-bold">${dateStr}</div>`;
                slider.appendChild(btn);
            }
        }

        function renderItinerary() {
            const list = document.getElementById('timeline-list');
            list.innerHTML = '';
            const dayItems = appData.itinerary.filter(item => item.day === appData.selectedDay);

            dayItems.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = "relative flex items-start gap-3 group";
                card.innerHTML = `
                    <div class="absolute -left-[30px] top-1 w-7 h-7 bg-picturebook-card border-2 border-picturebook-border rounded-full flex items-center justify-center text-xs shadow-sm z-20">
                        ${item.icon || '📌'}
                    </div>
                    <div class="bg-picturebook-card p-3.5 hand-card flex-1 flex items-start gap-2.5 relative">
                        <div class="flex-1">
                            <div class="flex justify-between items-center">
                                <span class="text-xs font-bold text-picturebook-mustard">${item.time}</span>
                                <span class="text-[10px] ${item.tagBg} px-2.5 py-0.5 rounded-full font-bold">${item.tag}</span>
                            </div>
                            <h4 class="text-sm font-bold text-picturebook-ink mt-0.5">${item.title}</h4>
                            <p class="text-xs text-picturebook-muted mt-1">${item.note}</p>
                        </div>
                        <div class="flex flex-col items-center gap-1.5 border-l border-picturebook-border/60 pl-2">
                            <div class="flex gap-1.5 bg-picturebook-bg p-1 rounded-lg border border-picturebook-border">
                                <button onclick="moveItineraryItem(${item.id}, 'up')" class="text-picturebook-ink text-xs px-1 ${index === 0 ? 'opacity-20' : ''}" title="往上移"><i class="fa-solid fa-arrow-up"></i></button>
                                <button onclick="moveItineraryItem(${item.id}, 'down')" class="text-picturebook-ink text-xs px-1 ${index === dayItems.length - 1 ? 'opacity-20' : ''}" title="往下移"><i class="fa-solid fa-arrow-down"></i></button>
                            </div>
                            <div class="flex gap-1.5 bg-picturebook-bg p-1 rounded-lg border border-picturebook-border">
                                <button onclick="openEditItemModal(${item.id})" class="text-picturebook-sky text-xs px-1" title="編輯"><i class="fa-solid fa-pen"></i></button>
                                <button onclick="deleteItineraryItem(${item.id})" class="text-picturebook-muted hover:text-picturebook-sakura text-xs px-1" title="刪除"><i class="fa-solid fa-trash-can"></i></button>
                            </div>
                        </div>
                    </div>
                `;
                list.appendChild(card);
            });
            if (dayItems.length === 0) list.innerHTML = `<div class="text-center py-8 text-xs text-picturebook-muted">今天尚無行程</div>`;
        }

        function moveItineraryItem(id, direction) {
            const dayItems = appData.itinerary.filter(item => item.day === appData.selectedDay);
            const index = dayItems.findIndex(item => item.id === id);
            if (index === -1) return;
            if (direction === 'up' && index > 0) {
                const target = dayItems[index - 1];
                const r1 = appData.itinerary.findIndex(i => i.id === id);
                const r2 = appData.itinerary.findIndex(i => i.id === target.id);
                [appData.itinerary[r1], appData.itinerary[r2]] = [appData.itinerary[r2], appData.itinerary[r1]];
            } else if (direction === 'down' && index < dayItems.length - 1) {
                const target = dayItems[index + 1];
                const r1 = appData.itinerary.findIndex(i => i.id === id);
                const r2 = appData.itinerary.findIndex(i => i.id === target.id);
                [appData.itinerary[r1], appData.itinerary[r2]] = [appData.itinerary[r2], appData.itinerary[r1]];
            }
            saveData(); renderItinerary();
        }

        function deleteItineraryItem(id) { appData.itinerary = appData.itinerary.filter(i => i.id !== id); saveData(); renderItinerary(); }
        
        function openAddItemModal() {
            editingItemId = null;
            document.getElementById('modal-itinerary-title').innerText = "✏️ 新增行程與交通";
            document.getElementById('input-item-title').value = '';
            document.getElementById('input-item-time').value = '10:00';
            document.getElementById('input-item-note').value = '';
            document.getElementById('modal-add-item').classList.remove('hidden');
        }

        function openEditItemModal(id) {
            editingItemId = id;
            const item = appData.itinerary.find(i => i.id === id);
            if (item) {
                document.getElementById('modal-itinerary-title').innerText = "✏️ 編輯行程與地點";
                document.getElementById('input-item-title').value = item.title;
                document.getElementById('input-item-time').value = item.time;
                document.getElementById('input-item-note').value = item.note || '';
                const cat = CATEGORIES.find(c => c.name === item.tag) || CATEGORIES[0];
                selectedCategory = cat;
            }
            document.getElementById('modal-add-item').classList.remove('hidden');
        }

        function closeAddItemModal() { document.getElementById('modal-add-item').classList.add('hidden'); }
        
        function saveItineraryItem() {
            const title = document.getElementById('input-item-title').value.trim();
            if (!title) { alert('請輸入標題'); return; }
            const time = document.getElementById('input-item-time').value.trim() || '10:00';
            const note = document.getElementById('input-item-note').value.trim() || '';

            if (editingItemId) {
                const item = appData.itinerary.find(i => i.id === editingItemId);
                if (item) {
                    item.title = title;
                    item.time = time;
                    item.note = note;
                    item.icon = selectedCategory.icon;
                    item.tag = selectedCategory.name;
                    item.tagBg = selectedCategory.bg;
                }
            } else {
                appData.itinerary.push({
                    id: Date.now(), day: appData.selectedDay, time, title,
                    icon: selectedCategory.icon, tag: selectedCategory.name, tagBg: selectedCategory.bg,
                    note, completed: false
                });
            }
            saveData(); renderItinerary(); closeAddItemModal();
        }

        function renderCategorySelector() {
            const c = document.getElementById('category-selector');
            c.innerHTML = '';
            CATEGORIES.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = "p-2 rounded-xl border flex flex-col items-center gap-1 bg-white text-xs";
                btn.onclick = () => { selectedCategory = cat; };
                btn.innerHTML = `<span>${cat.icon}</span><span>${cat.name}</span>`;
                c.appendChild(btn);
            });
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('text-picturebook-sky', 'tab-active'));
            document.getElementById(`nav-${tab}`).classList.add('text-picturebook-sky', 'tab-active');
        }

        function renderSpots() {
            const list = document.getElementById('spots-list');
            list.innerHTML = '';
            appData.spots.forEach(spot => {
                const card = document.createElement('div');
                card.className = "bg-picturebook-card p-3.5 hand-card flex flex-col justify-between";
                card.innerHTML = `<div><h4 class="text-xs font-bold text-picturebook-ink">${spot.name}</h4><p class="text-[11px] text-picturebook-muted mt-1">${spot.desc}</p></div>
                <div class="mt-3 flex justify-between items-center border-t border-picturebook-border pt-2"><button onclick="deleteSpot(${spot.id})" class="text-[11px] text-picturebook-muted hover:text-picturebook-sakura"><i class="fa-solid fa-trash-can"></i> 刪除</button></div>`;
                list.appendChild(card);
            });
        }

        function openAddSpotModal() {
            const name = prompt("景點名稱:");
            if (!name) return;
            const desc = prompt("筆記:", "") || "";
            appData.spots.push({ id: Date.now(), name, desc });
            saveData(); renderSpots();
        }

        function deleteSpot(id) { appData.spots = appData.spots.filter(s => s.id !== id); saveData(); renderSpots(); }

        function renderCompanions() { 
            document.getElementById('companions-chips').innerHTML = appData.companions.map(c => `<span class="bg-picturebook-sakura/15 text-picturebook-sakura px-2.5 py-1 rounded-full font-bold">${c}</span>`).join(''); 
        }

        function manageCompanions() {
            const input = prompt("請輸入同行成員，用逗號分開:", appData.companions.join(', '));
            if (input) {
                appData.companions = input.split(',').map(s => s.trim()).filter(s => s.length > 0);
                saveData(); renderCompanions(); calculateSettlement();
            }
        }

        function renderExpenses() { 
            document.getElementById('expenses-list').innerHTML = appData.expenses.map(e => `<div class="bg-white p-3 rounded-xl border border-picturebook-border flex justify-between items-center text-xs"><div><b>${e.title}</b> <span class="text-picturebook-muted">(${e.payer}付)</span></div><div class="font-bold text-picturebook-sakura">${e.amount} JPY</div></div>`).join(''); 
        }

        function openAddExpenseModal() {
            const title = prompt("品項名稱:");
            if (!title) return;
            const amount = parseFloat(prompt("金額 (JPY):", "1000"));
            if (isNaN(amount)) return;
            const payer = prompt(`誰付的？(${appData.companions.join('/')}):`, appData.companions[0]) || appData.companions[0];
            appData.expenses.push({ id: Date.now(), title, amount, payer, sharedBy: appData.companions });
            saveData(); renderExpenses(); calculateSettlement();
        }

        function renderChecklist() {
            const container = document.getElementById('checklist-items');
            container.innerHTML = '';
            appData.checklist.forEach(item => {
                const row = document.createElement('div');
                row.className = "flex items-center justify-between p-2 rounded-xl bg-picturebook-cream/60 border border-picturebook-border";
                row.innerHTML = `
                    <label class="flex items-center gap-2 cursor-pointer flex-1">
                        <input type="checkbox" ${item.checked ? 'checked' : ''} onchange="toggleChecklist(${item.id})" class="rounded text-picturebook-matcha">
                        <span class="${item.checked ? 'line-through text-picturebook-muted' : 'text-picturebook-ink'} font-bold">${item.text}</span>
                    </label>
                    <button onclick="deleteChecklist(${item.id})" class="text-picturebook-muted hover:text-picturebook-sakura text-xs px-1"><i class="fa-solid fa-xmark"></i></button>
                `;
                container.appendChild(row);
            });
        }

        function toggleChecklist(id) {
            const item = appData.checklist.find(i => i.id === id);
            if (item) { item.checked = !item.checked; saveData(); renderChecklist(); }
        }

        function addChecklistItem() {
            const text = prompt("請輸入準備項目:");
            if (text) { appData.checklist.push({ id: Date.now(), text, checked: false }); saveData(); renderChecklist(); }
        }

        function deleteChecklist(id) {
            appData.checklist = appData.checklist.filter(i => i.id !== id);
            saveData(); renderChecklist();
        }

        function calculateSettlement() {
            let total = 0;
            appData.expenses.forEach(e => total += e.amount);
            document.getElementById('settlement-breakdown').innerHTML = `<div class="flex justify-between font-bold"><span>全團總支出:</span><span class="text-picturebook-sakura">${total.toLocaleString()} JPY</span></div>`;
            document.getElementById('settlement-actions').innerHTML = `<div class="text-picturebook-matcha font-bold">✨ 帳目計算正常</div>`;
        }
    </script>
</body>
</html>

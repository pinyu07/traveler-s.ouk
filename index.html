<div class="bg-picturebook-card p-4 hand-card space-y-3">

</div>

<option value="">無/不指定</option><option value="🚶 步行">🚶 步行</option><option value="🚃 電車/地鐵">🚃 電車/地鐵</option><option value="🚌 公車/巴士">🚌 公車/巴士</option><option value="🚕 計程車">🚕 計程車</option><option value="🚗 自駕車行">🚗 自駕車行</option><option value="🚄 新幹線/特急">🚄 新幹線/特急</option></select></div>
<div><label class="text-[11px] font-bold text-picturebook-muted block mb-1">備註：</label>
<input id="input-item-note" type="text" placeholder="備註或注意事項" class="w-full text-xs p-2 rounded-xl border border-picturebook-border focus:outline-none bg-white"></div>

</div></div>

<nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-picturebook-card border-t-2 border-picturebook-border flex justify-around py-2.5 px-1 z-30 shadow-lg rounded-t-[20px]">
<button id="nav-itinerary" class="flex flex-col items-center text-picturebook-sky tab-active"><i class="fa-solid fa-book-open text-base"></i><span class="text-[9px] mt-0.5 font-bold">行程</span></button>
<button id="nav-spots" class="flex flex-col items-center text-picturebook-muted"><i class="fa-solid fa-compass text-base"></i><span class="text-[9px] mt-0.5 font-bold">景點</span></button>
<button id="nav-expenses" class="flex flex-col items-center text-picturebook-muted"><i class="fa-solid fa-coins text-base"></i><span class="text-[9px] mt-0.5 font-bold">記帳分帳</span></button>
<button id="nav-checklist" class="flex flex-col items-center text-picturebook-muted"><i class="fa-solid fa-list-check text-base"></i><span class="text-[9px] mt-0.5 font-bold">清單</span></button>
<button id="nav-toolbox" class="flex flex-col items-center text-picturebook-muted"><i class="fa-solid fa-toolbox text-base"></i><span class="text-[9px] mt-0.5 font-bold">工具箱</span></button>
</nav>

<script>
const CATEGORIES=[
{name:"美食",icon:"🍱",bg:"bg-picturebook-sakura/20 text-picturebook-sakura"},
{name:"觀光",icon:"⛩️",bg:"bg-picturebook-mustard/20 text-picturebook-mustard"},
{name:"交通",icon:"🚃",bg:"bg-picturebook-sky/20 text-picturebook-sky"},
{name:"購物",icon:"🛍️",bg:"bg-picturebook-sakura/20 text-picturebook-sakura"},
{name:"其他",icon:"🎈",bg:"bg-picturebook-cream text-picturebook-ink"}];
const FLAG_MAP={"日本":"🇯🇵","韓國":"🇰🇷","泰國":"🇹🇭","越南":"🇻🇳","新加坡":"🇸🇬","馬來西亞":"🇲🇾","美國":"🇺🇸","英國":"🇬🇧","法國":"🇫🇷","義大利":"🇮🇹","德國":"🇩🇪","加拿大":"🇨🇦","澳洲":"🇦🇺","紐西蘭":"🇳🇿","香港":"🇭🇰","澳門":"🇲🇴"};
const STORE_KEY='picturebook_travel_app_v24';
let selectedCategory=CATEGORIES[0],editingItemId=null;
let appData={
title:"關東秋季自由行 🍁",destination:"東京/日本",startDate:"2026-10-15",totalDays:5,
weatherText:"🍂 18°C ~ 22°C 晴時多雲",weatherAuto:true,weatherSrc:"",geo:null,
fxCode:"JPY",fxRate:0.210,fxAuto:true,fxUpdated:"",fxTable:null,
companions:["我","夥伴A","夥伴B"],selectedDay:1,
flightGo:"JL096 (TSA 09:15 -> HND 13:20)",flightBack:"JL099 (HND 18:20 -> TSA 20:50)",rentalInfo:"Toyota Rent-a-Car (預約號: #883921)",
hotels:[{id:1,name:"淺草日系包棟 Villa",address:"東京都台東區淺草 2-1-1",code:"#1234*",notes:"15:00 Check-in / 11:00 Check-out，垃圾需分類放入指定桶內。"}],
itinerary:[{id:1,day:1,time:"09:00",title:"抵達羽田機場",icon:"🚃",tag:"交通",tagBg:"bg-picturebook-sky/20 text-picturebook-sky",duration:"1小時",transit:"🚃 電車/地鐵",note:"搭乘單軌電車",completed:false,mapUrl:"https://www.google.com/maps/search/?api=1&query=羽田機場"}],
spots:[{id:1,name:"SHIBUYA SKY",desc:"看夜景",mapUrl:"https://www.google.com/maps/search/?api=1&query=SHIBUYA+SKY"}],
expenses:[{id:1,title:"景點門票聯票",amount:12000,payer:"夥伴A",sharedBy:["我","夥伴A","夥伴B"]},{id:2,title:"居酒屋美味晚餐",amount:6000,payer:"我",sharedBy:["我","夥伴A","夥伴B"]}],
checklist:[{id:1,text:"護照與簽證文件",checked:true}],
updatedAt:0};

/* ---------- 日期工具 (本地時區，避免差一天) ---------- */
const pad=n=>String(n).padStart(2,'0');
function parseLocal(s){const m=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec((s||'').trim());return m?new Date(+m[1],+m[2]-1,+m[3]):null}
function fmtYMD(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function startDateObj(){return parseLocal(appData.startDate)||new Date(new Date().setHours(0,0,0,0))}
function todayDayNumber(){ // 今天是旅程第幾天；不在旅程內回傳 0
 const t=new Date();t.setHours(0,0,0,0);
 const n=Math.round((t-startDateObj())/86400000)+1;
 return (n>=1&&n<=appData.totalDays)?n:0}

/* ---------- 通用表單視窗 (取代連續 prompt；按取消不會改到一半) ---------- */
const INP="w-full text-xs p-2 rounded-xl border border-picturebook-border focus:outline-none bg-white font-bold";
function askForm(title,fields,cb){
 const w=document.createElement('div');w.className='fixed inset-0 bg-black/40 backdrop-blur-sm z-[60] flex items-center justify-center p-4';
 w.innerHTML=`<div class="bg-picturebook-card w-full max-w-sm p-4 hand-card space-y-2.5 max-h-[90vh] overflow-y-auto"><div class="flex justify-between items-center border-b border-picturebook-border pb-2"><h3 class="font-bold text-sm text-picturebook-ink">${title}</h3><button data-x class="text-picturebook-muted text-lg">✕</button></div>${fields.map((f,i)=>`<div><label class="text-[11px] font-bold text-picturebook-muted block mb-1">${f.label}</label>${f.type==='textarea'?`<textarea data-f="${i}" rows="3" class="${INP}"></textarea>`:`<input data-f="${i}" type="${f.type||'text'}" step="any" class="${INP}">`}</div>`).join('')}<button data-ok class="w-full bg-picturebook-sky text-white py-2 hand-btn font-bold text-xs mt-2">儲存</button></div>`;
 document.body.appendChild(w);
 const els=[...w.querySelectorAll('[data-f]')];els.forEach((el,i)=>el.value=(fields[i].value===undefined||fields[i].value===null)?'':fields[i].value);
 w.querySelector('[data-x]').onclick=()=>w.remove();
 w.querySelector('[data-ok]').onclick=()=>{const v={};els.forEach((el,i)=>v[fields[i].k]=el.value.trim());if(cb(v)!==false)w.remove()};
 if(els[0])els[0].focus()}

/* ---------- 啟動 ---------- */
function renderAll(){renderHeader();renderDaysSlider();renderItinerary();renderSpots();renderCompanions();renderExpenses();calculateSettlement();renderChecklist();renderCategorySelector();renderToolbox()}
window.addEventListener('DOMContentLoaded',async()=>{
 try{
  loadLocalData();
  const td=todayDayNumber(); if(td) appData.selectedDay=td; // 旅程期間自動切到今天
  if(appData.selectedDay>appData.totalDays) appData.selectedDay=1;
  renderAll();initEventListeners();
 }catch(e){console.error("初始化錯誤:",e)}
 await checkHashImport();   // 朋友打開分享連結時自動匯入

function sanitizeImported(o){ // 朋友傳來的資料可能含惡意 HTML，匯入前先消毒
 const clean=v=>{if(typeof v==='string')return v.replace(/</g,'＜').replace(/>/g,'＞').replace(/"/g,'”').replace(/`/g,'’');
  if(Array.isArray(v))return v.map(clean);
  if(v&&typeof v==='object'){const r={};for(const k in v)r[k]=clean(v[k]);return r}return v};
 const d=clean(o);
 const fix=(arr,key)=>(arr||[]).forEach(i=>{if(!/^https:\/\/www\.google\.com\/maps\//.test(i.mapUrl||''))i.mapUrl='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(i[key]||'')});
 fix(d.itinerary,'title');fix(d.spots,'name');return d}

function rateOf(code){ // 1 外幣 = ? TWD
 if(code==='TWD')return 1;

/* ---------- 線上天氣 (Open-Meteo，免金鑰) ---------- */
function wmo(c){if(c===0)return['☀️','晴天'];if(c<=2)return['⛅','晴時多雲'];if(c===3)return['☁️','陰天'];if(c<=48)return['🌫️','有霧'];if(c<=57)return['🌦️','毛毛雨'];if(c<=67)return['🌧️','下雨'];if(c<=77)return['❄️','下雪'];if(c<=82)return['🌦️','陣雨'];if(c<=86)return['❄️','陣雪'];return['⛈️','雷雨']}
async function geocode(){
 if(appData.geo&&appData.geo.q===appData.destination)return appData.geo;
 const parts=appData.destination.split(/[\/／,，]/).map(x=>x.trim()).filter(Boolean);
 for(const q of parts.concat([appData.destination])){
  try{const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=zh`);const j=await r.json();
   if(j.results&&j.results[0]){const g=j.results[0];appData.geo={q:appData.destination,lat:g.latitude,lon:g.longitude};return appData.geo}}catch(e){}}
 return null}
async function refreshWeather(showMsg){
 if(!appData.weatherAuto)return false;
 const g=await geocode();
 if(!g){if(showMsg)alert('找不到目的地位置，請把目的地改成城市名稱（例如：東京/日本）。');return false}
 const day=n=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+n);return d};
 const s=startDateObj(),e=new Date(s);e.setDate(s.getDate()+appData.totalDays-1);
 const today=day(0),lim=day(15);
 const q=`latitude=${g.lat}&longitude=${g.lon}&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto`;
 let url,src;
 if(e<today){url=`https://archive-api.open-meteo.com/v1/archive?${q}&start_date=${fmtYMD(s)}&end_date=${fmtYMD(e)}`;src='實際天氣'}
 else if(s<=lim){const a=s<today?today:s,b=e>lim?lim:e;url=`https://api.open-meteo.com/v1/forecast?${q}&start_date=${fmtYMD(a)}&end_date=${fmtYMD(b)}`;src=e>lim?'線上預報(僅前16天)':'線上預報'}
 else{const s2=new Date(s),e2=new Date(e);s2.setFullYear(s.getFullYear()-1);e2.setFullYear(e.getFullYear()-1);
  url=`https://archive-api.open-meteo.com/v1/archive?${q}&start_date=${fmtYMD(s2)}&end_date=${fmtYMD(e2)}`;src='去年同期參考'}
 try{
  const j=await(await fetch(url)).json(),d=j.daily;
  const mx=d.temperature_2m_max.filter(v=>v!=null),mn=d.temperature_2m_min.filter(v=>v!=null),cs=d.weather_code.filter(v=>v!=null);
  if(!mx.length||!cs.length)throw new Error('no data');
  const cnt={};cs.forEach(c=>{const k=wmo(c).join(' ');cnt[k]=(cnt[k]||0)+1});
  const top=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];
  appData.weatherText=`${top.split(' ')[0]} ${Math.round(Math.min(...mn))}°C ~ ${Math.round(Math.max(...mx))}°C ${top.split(' ')[1]}`;
  appData.weatherSrc='🌐 '+src;
  saveQuiet();renderHeader();return true
 }catch(err){if(showMsg)alert('抓取線上天氣失敗，請稍後再試。');return false}}

function b64u(u8){let s='';u8.forEach(b=>s+=String.fromCharCode(b));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function unb64u(str){str=str.replace(/-/g,'+').replace(/_/g,'/');while(str.length%4)str+='=';return Uint8Array.from(atob(str),c=>c.charCodeAt(0))}
let shareWithCodes=false;
function sharePayload(){const d=JSON.parse(JSON.stringify(appData));delete d.fxTable;if(!shareWithCodes)(d.hotels||[]).forEach(h=>h.code='');d.updatedAt=appData.updatedAt||Date.now();return d}
async function encodeTrip(obj){
 const bytes=new TextEncoder().encode(JSON.stringify(obj));
 if(window.CompressionStream){
  const cs=new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'));
  return 'z'+b64u(new Uint8Array(await new Response(cs).arrayBuffer()))}
 return 'r'+b64u(bytes)}
async function decodeTrip(code){
 code=code.trim();const u8=unb64u(code.slice(1));let bytes=u8;
 if(code[0]==='z'){
  if(!window.DecompressionStream)throw new Error('瀏覽器不支援');
  const ds=new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip'));
  bytes=new Uint8Array(await new Response(ds).arrayBuffer())}
 return JSON.parse(new TextDecoder().decode(bytes))}
async function copyText(text,msg){

function fmtTime(ts){if(!ts)return'未知';const d=new Date(ts);return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`}
function mergeData(mine,t){
 const m=JSON.parse(JSON.stringify(mine));
 const base=(t.updatedAt||0)>=(m.updatedAt||0)?Object.assign({},m,t):Object.assign({},t,m);
 ['itinerary','spots','expenses','checklist','hotels'].forEach(k=>{
  const map=new Map();(m[k]||[]).forEach(x=>map.set(x.id,x));(t[k]||[]).forEach(x=>map.set(x.id,x));base[k]=[...map.values()]});
 base.companions=[...new Set([...(m.companions||[]),...(t.companions||[])])];
 base.updatedAt=Date.now();return base}
function applyImported(data,label){
 if(!data||!data.itinerary||!data.title)throw new Error('資料格式不正確');
 data=normalizeData(sanitizeImported(data));
 const mine=appData.updatedAt||0,theirs=data.updatedAt||0;
 let msg=`收到「${data.title}」（${label}，最後修改 ${fmtTime(theirs)}）。\n你目前的版本最後修改 ${fmtTime(mine)}。`;
 if(theirs&&mine&&theirs<mine)msg+='\n⚠️ 對方的版本比你的舊。';
 const c=prompt(msg+'\n\n1 = 合併（保留雙方新增的項目；相同項目以對方為準；對方刪除的項目不會同步）\n2 = 整份覆蓋成對方的版本\n其他 = 取消','1');
 if(c!=='1'&&c!=='2')return false;
 const oldCodes={};appData.hotels.forEach(h=>oldCodes[h.id]=h.code);
 const keep={fxTable:appData.fxTable,fxUpdated:appData.fxUpdated};
 appData=c==='1'?mergeData(appData,data):data;
 Object.assign(appData,keep);
 appData.hotels.forEach(h=>{if(!h.code&&oldCodes[h.id])h.code=oldCodes[h.id]});
 appData.selectedDay=todayDayNumber()||1;
 saveQuiet();renderAll();refreshRates(false);refreshWeather(false);return true}

      <button class="btn-move-down text-picturebook-ink text-xs px-1 ${index===dayItems.length-1?'opacity-20':''}" data-id="${item.id}"><i class="fa-solid fa-arrow-down"></i></button></div>

    </div></div></div>
  ${item.transit?`<div class="ml-2 my-0.5 text-[10px] text-picturebook-muted font-bold flex items-center gap-1 bg-picturebook-cream/80 border border-picturebook-border/70 px-2.5 py-1 rounded-full w-max shadow-sm">${item.transit}</div>`:''}`;
  list.appendChild(w)});
 if(!dayItems.length)list.innerHTML=`<div class="text-center py-8 text-xs text-picturebook-muted">今天尚無行程</div>`;
 list.querySelectorAll('.chk-done').forEach(k=>k.addEventListener('change',e=>{const it=appData.itinerary.find(x=>x.id===Number(e.currentTarget.dataset.id));if(it){it.completed=e.currentTarget.checked;saveData();renderItinerary()}}));
 list.querySelectorAll('.btn-move-up').forEach(b=>b.addEventListener('click',e=>moveItineraryItem(Number(e.currentTarget.dataset.id),'up')));
 list.querySelectorAll('.btn-move-down').forEach(b=>b.addEventListener('click',e=>moveItineraryItem(Number(e.currentTarget.dataset.id),'down')));

 list.querySelectorAll('.btn-del-item').forEach(b=>b.addEventListener('click',e=>deleteItineraryItem(Number(e.currentTarget.dataset.id))))}
function moveItineraryItem(id,dir){
 const di=appData.itinerary.filter(i=>i.day===appData.selectedDay);
 const idx=di.findIndex(i=>i.id===id);if(idx===-1)return;
 const t=dir==='up'?di[idx-1]:di[idx+1];if(!t)return;
 const r1=appData.itinerary.findIndex(i=>i.id===id),r2=appData.itinerary.findIndex(i=>i.id===t.id);
 [appData.itinerary[r1],appData.itinerary[r2]]=[appData.itinerary[r2],appData.itinerary[r1]];
 saveData();renderItinerary()}
function deleteItineraryItem(id){appData.itinerary=appData.itinerary.filter(i=>i.id!==id);saveData();renderItinerary()}
function openAddItemModal(){
 editingItemId=null;selectedCategory=CATEGORIES[0];renderCategorySelector();
 document.getElementById('modal-itinerary-title').innerText="✏️ 新增行程與交通";
 ['title','duration','note'].forEach(k=>document.getElementById('input-item-'+k).value='');
 document.getElementById('input-item-time').value='10:00';document.getElementById('input-item-transit').value='';
 document.getElementById('modal-add-item').classList.remove('hidden')}
function openEditItemModal(id){
 editingItemId=id;const item=appData.itinerary.find(i=>i.id===id);
 if(item){document.getElementById('modal-itinerary-title').innerText="✏️ 編輯行程與地點";
  document.getElementById('input-item-title').value=item.title;document.getElementById('input-item-time').value=item.time;
  document.getElementById('input-item-duration').value=item.duration||'';document.getElementById('input-item-transit').value=item.transit||'';
  document.getElementById('input-item-note').value=item.note||'';
  selectedCategory=CATEGORIES.find(c=>c.name===item.tag)||CATEGORIES[0];renderCategorySelector()}
 document.getElementById('modal-add-item').classList.remove('hidden')}
function closeAddItemModal(){document.getElementById('modal-add-item').classList.add('hidden')}
function saveItineraryItem(){
 const title=document.getElementById('input-item-title').value.trim();if(!title){alert('請輸入標題');return}
 const time=document.getElementById('input-item-time').value.trim()||'10:00';
 const duration=document.getElementById('input-item-duration').value.trim();
 const transit=document.getElementById('input-item-transit').value;
 const note=document.getElementById('input-item-note').value.trim()||'';
 const mapUrl=`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(title)}`;
 if(editingItemId){const it=appData.itinerary.find(i=>i.id===editingItemId);
  if(it)Object.assign(it,{title,time,duration,transit,note,icon:selectedCategory.icon,tag:selectedCategory.name,tagBg:selectedCategory.bg,mapUrl})}
 else appData.itinerary.push({id:Date.now(),day:appData.selectedDay,time,title,duration,transit,icon:selectedCategory.icon,tag:selectedCategory.name,tagBg:selectedCategory.bg,note,completed:false,mapUrl});
 appData.itinerary.sort((a,b)=>a.day-b.day||String(a.time).localeCompare(String(b.time)));
 saveData();renderItinerary();closeAddItemModal()}
function renderCategorySelector(){
 const c=document.getElementById('category-selector');if(!c)return;c.innerHTML='';
 CATEGORIES.forEach(cat=>{const b=document.createElement('button');
  b.className="p-2 rounded-xl border flex flex-col items-center gap-1 bg-white text-xs"+(cat===selectedCategory?' cat-on':'');
  b.addEventListener('click',()=>{selectedCategory=cat;renderCategorySelector()});
  b.innerHTML=`<span>${cat.icon}</span><span>${cat.name}</span>`;c.appendChild(b)})}
function switchTab(tab){
 document.querySelectorAll('.tab-content').forEach(el=>el.classList.add('hidden'));
 const t=document.getElementById('tab-'+tab);if(t)t.classList.remove('hidden');
 document.querySelectorAll('nav button').forEach(b=>b.classList.remove('text-picturebook-sky','tab-active'));
 const n=document.getElementById('nav-'+tab);if(n)n.classList.add('text-picturebook-sky','tab-active')}

/* ---------- 夥伴 / 分帳 ---------- */
function renderCompanions(){
 const c=document.getElementById('companions-chips');if(!c)return;c.innerHTML='';
 appData.companions.forEach(n=>{const s=document.createElement('span');
  s.className="bg-picturebook-sakura/15 text-picturebook-sakura px-2.5 py-1 rounded-full border border-picturebook-sakura/30 font-bold";s.innerText=n;c.appendChild(s)})}
function manageCompanions(){
 askForm('👥 同行成員',[{k:'n',label:'用逗號分開（改名請保持同樣順序，帳目會自動跟著更新）',value:appData.companions.join(', ')}],v=>{
  const nw=v.n.split(/[,，]/).map(x=>x.trim()).filter(Boolean);
  if(!nw.length){alert('至少要有一位成員');return false}
  const old=appData.companions;
  if(old.length===nw.length){const m={};old.forEach((o,i)=>{if(o!==nw[i])m[o]=nw[i]});
   appData.expenses.forEach(e=>{if(m[e.payer])e.payer=m[e.payer];e.sharedBy=e.sharedBy.map(x=>m[x]||x)})}
  appData.companions=nw;saveData();renderCompanions();calculateSettlement()})}
const rateFor=c=>c==='TWD'?1:(c===appData.fxCode?appData.fxRate:(rateOf(c)||1));
const twdOf=e=>e.amount*rateFor(e.cur||appData.fxCode);
function renderExpenses(){
 const list=document.getElementById('expenses-list');if(!list)return;list.innerHTML='';
 appData.expenses.forEach(item=>{
  const c=document.createElement('div');c.className="bg-picturebook-card p-3.5 hand-card flex justify-between items-center";
  c.innerHTML=`<div class="flex-1"><div class="text-xs font-bold text-picturebook-ink">${item.title}</div>
  <div class="text-[10px] text-picturebook-muted mt-0.5"><span class="text-picturebook-sakura font-bold">${item.payer}</span> 掏錢 ｜ 平分: ${item.sharedBy.join(', ')}</div></div>
  <div class="text-right mr-3"><div class="text-xs font-bold text-picturebook-ink">${Number(item.amount).toLocaleString()} ${item.cur||appData.fxCode}</div>
  <div class="text-[10px] text-picturebook-muted font-bold">(約 NT$ ${Math.round(twdOf(item)).toLocaleString()})</div></div>
  <div class="flex items-center gap-1.5"><button class="btn-edit-exp text-picturebook-sky text-xs p-1" data-id="${item.id}"><i class="fa-solid fa-pen"></i></button>
  <button class="btn-del-exp text-picturebook-muted hover:text-picturebook-sakura text-xs p-1" data-id="${item.id}"><i class="fa-solid fa-trash-can"></i></button></div>`;
  list.appendChild(c)});
 if(!appData.expenses.length)list.innerHTML=`<div class="text-center py-4 text-xs text-picturebook-muted">目前尚無消費紀錄</div>`;
 list.querySelectorAll('.btn-edit-exp').forEach(b=>b.addEventListener('click',e=>editExpense(Number(e.currentTarget.dataset.id))));
 list.querySelectorAll('.btn-del-exp').forEach(b=>b.addEventListener('click',e=>deleteExpense(Number(e.currentTarget.dataset.id))))}
function expenseForm(it){
 const P=appData.companions;
 askForm(it.id?'✏️ 修改消費':'📝 記一筆',[{k:'title',label:'品項名稱',value:it.title},{k:'amount',label:'金額',type:'number',value:it.amount},{k:'cur',label:'幣別 (JPY / TWD / USD…)',value:it.cur||appData.fxCode},{k:'payer',label:'誰先墊付 ('+P.join(' / ')+')',value:it.payer},{k:'sharedBy',label:'誰要平分 (逗號分開)',value:it.sharedBy.join(',')}],v=>{
  const amount=parseFloat(v.amount);if(!v.title||!(amount>0)){alert('請輸入品項與金額');return false}
  if(!P.includes(v.payer)){alert('墊付者必須是夥伴名單中的人');return false}
  const sb=v.sharedBy.split(/[,，]/).map(x=>x.trim()).filter(Boolean),bad=sb.filter(x=>!P.includes(x));
  if(bad.length||!sb.length){alert('平分名單有不在夥伴中的名字：'+bad.join(', '));return false}
  const rec={title:v.title,amount,cur:(v.cur||appData.fxCode).toUpperCase(),payer:v.payer,sharedBy:sb};
  if(it.id)Object.assign(appData.expenses.find(e=>e.id===it.id),rec);else appData.expenses.push({id:Date.now(),...rec});
  saveData();renderExpenses();calculateSettlement()})}
function openAddExpenseModal(){expenseForm({title:'',amount:'',payer:appData.companions[0],sharedBy:appData.companions})}
function editExpense(id){const it=appData.expenses.find(e=>e.id===id);if(it)expenseForm(it)}
function deleteExpense(id){appData.expenses=appData.expenses.filter(e=>e.id!==id);saveData();renderExpenses();calculateSettlement()}
function calculateSettlement(){ // 全部換算成台幣結算
 const bd=document.getElementById('settlement-breakdown'),act=document.getElementById('settlement-actions');
 if(!bd||!act)return;bd.innerHTML='';act.innerHTML='';
 if(!appData.expenses.length){bd.innerHTML=`<div class="text-picturebook-muted">目前尚未記錄任何支出</div>`;return}
 let total=0,warn=0;const paid={},owe={},pw={},P=appData.companions;
 P.forEach(a=>{paid[a]=0;owe[a]=0;pw[a]={};P.forEach(b=>{if(a!==b)pw[a][b]=0})});
 appData.expenses.forEach(e=>{
  const amt=twdOf(e);total+=amt;
  const vs=e.sharedBy.filter(x=>P.includes(x));
  if(paid[e.payer]===undefined||vs.length!==e.sharedBy.length)warn++;
  if(paid[e.payer]!==undefined)paid[e.payer]+=amt;
  const per=amt/(vs.length||1);
  vs.forEach(x=>{owe[x]+=per;if(x!==e.payer&&pw[x]&&pw[x][e.payer]!==undefined)pw[x][e.payer]+=per})});
 bd.innerHTML=`<div class="flex justify-between items-center font-bold border-b border-picturebook-border pb-1.5 mb-2"><span>全團總支出 (換算台幣):</span><span class="text-picturebook-sakura font-bold">NT$ ${Math.round(total).toLocaleString()}</span></div>`
  +(warn?`<div class="text-[11px] text-picturebook-sakura font-bold mb-1">⚠️ 有 ${warn} 筆消費的人名不在夥伴名單中，結算可能漏算，請編輯該筆。</div>`:'');
 P.forEach(p=>{const net=paid[p]-owe[p];const r=document.createElement('div');r.className="flex justify-between items-center text-[11px] mb-1";
  r.innerHTML=`<span><strong>${p}</strong> (已墊: ${Math.round(paid[p]).toLocaleString()} / 應付: ${Math.round(owe[p]).toLocaleString()})</span><span class="${net>=0?'text-picturebook-matcha font-bold':'text-picturebook-sakura font-bold'}">${net>=0?'淨收 +':'淨付 '}NT$ ${Math.round(net).toLocaleString()}</span>`;bd.appendChild(r)});
 const pairs=[],seen=new Set();
 P.forEach(a=>P.forEach(b=>{if(a!==b&&!seen.has(`${b}-${a}`)){seen.add(`${a}-${b}`);const d=(pw[a][b]||0)-(pw[b][a]||0);
  if(d>1)pairs.push({debtor:a,creditor:b,amount:d});else if(d<-1)pairs.push({debtor:b,creditor:a,amount:-d})}}));
 act.innerHTML=`<div class="text-[11px] font-bold text-picturebook-ink mb-1 mt-2">🤝 直接轉帳對帳清單 (台幣)：</div>`;
 if(!pairs.length)act.innerHTML+=`<div class="text-picturebook-matcha font-bold mt-1">✨ 大家帳目剛好平衡，無須互相轉帳！</div>`;
 else pairs.forEach(it=>{const d=document.createElement('div');
  d.className="bg-white p-2.5 rounded-xl border border-picturebook-border flex items-center justify-between text-picturebook-ink shadow-sm mb-1.5";
  d.innerHTML=`<span>💳 <strong class="text-picturebook-sakura">${it.debtor}</strong> 應付給 <strong class="text-picturebook-sky">${it.creditor}</strong></span><span class="text-picturebook-sakura font-bold">NT$ ${Math.round(it.amount).toLocaleString()}</span>`;act.appendChild(d)})}

 appData.checklist.forEach(it=>{const r=document.createElement('div');r.className="flex items-center justify-between p-2 rounded-xl bg-picturebook-cream/60 border border-picturebook-border";
  r.innerHTML=`<label class="flex items-center gap-2 cursor-pointer flex-1"><input type="checkbox" ${it.checked?'checked':''} class="chk-item rounded text-picturebook-matcha" data-id="${it.id}"><span class="${it.checked?'line-through text-picturebook-muted':'text-picturebook-ink'} font-bold">${it.text}</span></label><button class="btn-del-chk text-picturebook-muted hover:text-picturebook-sakura text-xs px-1" data-id="${it.id}"><i class="fa-solid fa-xmark"></i></button>`;c.appendChild(r)});

 c.querySelectorAll('.btn-del-chk').forEach(b=>b.addEventListener('click',e=>deleteChecklist(Number(e.currentTarget.dataset.id))))}

function calculateTax(){
 const input=parseFloat(document.getElementById('input-tax-calc').value);
 const curr=document.getElementById('select-tax-currency').value;
 if(isNaN(input)||input<=0){alert('請輸入有效的金額');return}
 // 優先用線上匯率表，其次用 header 設定，最後才用預設值
 const rate=rateOf(curr)||((curr===appData.fxCode)?appData.fxRate:0.21);
 const jp=curr==='JPY';
 document.getElementById('res-tax-8').previousElementSibling.innerText=jp?'含稅 8% (食品)':'含稅 8% (日本稅率)';
 document.getElementById('res-tax-10').previousElementSibling.innerText=jp?'含稅 10% (標準)':'含稅 10% (日本稅率)';
 const v=[Math.round(input),Math.round(input*1.08),Math.round(input*1.10)];
 [['free',0],['8',1],['10',2]].forEach(([k,i])=>{
  document.getElementById('res-tax-'+k).innerText=`${v[i].toLocaleString()} ${curr}`;
  document.getElementById('res-tax-'+k+'-twd').innerText=`≈ NT$ ${Math.round(v[i]*rate).toLocaleString()}`});
 document.getElementById('tax-calc-results').classList.remove('hidden')}
function editFlightInfo(){
 askForm('✈️ 航班與租車',[{k:'g',label:'去程航班',value:appData.flightGo},{k:'b',label:'回程航班',value:appData.flightBack},{k:'r',label:'租車預約資訊',value:appData.rentalInfo}],v=>{
  appData.flightGo=v.g;appData.flightBack=v.b;appData.rentalInfo=v.r;saveData();renderToolbox()})}

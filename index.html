<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日系手帳風旅遊與分帳 App</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        picturebook: {
                            bg: '#FFFDF9',
                            card: '#FFFFFF',
                            cream: '#FFF7E6',
                            matcha: '#859F7A',
                            sakura: '#E8A5A5',
                            mustard: '#E0A949',
                            sky: '#81A3BD',
                            lightYellow: '#FDF6E2',
                            lightBlue: '#E6F0F7',
                            ink: '#4A3E3D',
                            muted: '#A0938E',
                            border: '#E8E1D7'
                        }
                    },
                    fontFamily: {
                        hand: ['"Zen Maru Gothic"', '"Noto Sans TC"', 'sans-serif'],
                        title: ['"Mochiy Pop One"', '"Zen Maru Gothic"', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #FFFDF9;
            color: #4A3E3D;
            font-family: 'Zen Maru Gothic', 'Noto Sans TC', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .hand-card {
            border-radius: 18px 14px 20px 16px;
            border: 2px solid #E8E1D7;
            box-shadow: 3px 3px 0px #E8E1D7;
        }
        .hand-card-sm {
            border-radius: 14px 12px 15px 11px;
            border: 2px solid #E8E1D7;
        }
        .hand-btn {
            border-radius: 12px 14px 11px 13px;
            box-shadow: 2px 2px 0px #4A3E3D;
            transition: all 0.1s ease;
        }
        .hand-btn:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px #4A3E3D;
        }
        .tab-active { 
            color: #81A3BD; 
            border-bottom: 3px solid #81A3BD; 
            font-weight: 700; 
        }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen flex flex-col justify-between relative shadow-2xl bg-picturebook-bg">

    <!-- Header Section -->
    <header class="bg-gradient-to-r from-picturebook-lightYellow via-picturebook-cream to-picturebook-lightBlue text-picturebook-ink p-5 rounded-b-[28px] shadow-sm relative overflow-hidden border-b-2 border-picturebook-border">
        <div class="flex justify-between items-start relative z-10">
            <div>
                <div class="flex items-center gap-2">
                    <span id="trip-dest-badge" class="bg-white/80 text-picturebook-ink text-xs px-3 py-1 rounded-full font-bold tracking-wide border border-picturebook-border shadow-sm">🇯🇵 東京/日本</span>
                    <!-- 縮小版且乾淨的分享連結按鈕 -->
                    <button onclick="shareTripUrl()" class="text-[10px] bg-picturebook-matcha text-white px-2.5 py-1 hand-btn font-bold">
                        <i class="fa-solid fa-share-nodes mr-1"></i>分享連結
                    </button>
                </div>
                
                <div class="flex items-center gap-2 mt-1.5">
                    <h1 id="trip-title" class="text-2xl font-title text-picturebook-ink">關東秋季自由行 🍁</h1>
                    <button onclick="openTripTitleEditModal()" class="w-6 h-6 bg-white/80 hover:bg-white text-picturebook-ink rounded-full flex items-center justify-center transition border border-picturebook-border shadow-sm" title="修改標題">
                        <i class="fa-solid fa-pen text-[10px] text-picturebook-sky"></i>
                    </button>
                </div>
                
                <p id="trip-dates-text" onclick="openTripDatesEditModal()" class="text-xs text-picturebook-muted mt-1 font-bold cursor-pointer hover:text-picturebook-sky transition inline-block">
                    <i class="fa-regular fa-calendar-check mr-1 text-picturebook-sky"></i>2026/10/15 - 2026/10/19 (5天) <i class="fa-solid fa-pen-to-square text-[10px] ml-1"></i>
                </p>
            </div>
        </div>

        <!-- Weather & Currency Mini Bar -->
        <div class="mt-4 pt-3 border-t border-picturebook-border/60 flex justify-between items-center text-xs">
            <div class="flex items-center gap-2 cursor-pointer bg-white/60 px-2.5 py-1 rounded-xl border border-picturebook-border/40 shadow-sm" onclick="openWeatherModal()">
                <span id="weather-icon-display" class="text-xl">☀️</span>
                <div>
                    <div id="weather-temp-display" class="font-bold text-picturebook-ink">22°C - 26°C</div>
                    <div id="weather-wear-display" class="text-picturebook-muted text-[10px]">薄外套 / 舒適穿搭</div>
                </div>
            </div>
            <div class="flex items-center gap-2 cursor-pointer bg-white/60 px-2.5 py-1 rounded-xl border border-picturebook-border/40 shadow-sm" onclick="openFxModal()">
                <span class="text-lg">💴</span>
                <div class="text-right">
                    <div class="font-bold text-picturebook-ink">1 <span id="fx-code-display">JPY</span> = <span id="fx-rate-display">0.210</span> TWD</div>
                    <div class="text-picturebook-muted text-[10px]">即時連線 🪙</div>
                </div>
            </div>
        </div>
    </header>

    <!-- Date / Day Selector Slider -->
    <div class="px-4 mt-3">
        <div id="day-slider" class="flex gap-2 overflow-x-auto hide-scrollbar py-1"></div>
    </div>

    <!-- Main Content Container -->
    <main class="flex-1 px-4 py-2 pb-24 overflow-y-auto">

        <!-- TAB 1: ITINERARY -->
        <div id="tab-itinerary" class="tab-content space-y-3">
            <div class="flex justify-between items-center px-1 pt-1">
                <h2 class="font-bold text-picturebook-ink text-sm"><i class="fa-solid fa-list-ul text-picturebook-sky mr-1.5"></i>行程時間軸</h2>
                <button onclick="openAddItemModal()" class="text-xs bg-picturebook-sky text-white px-3.5 py-2 hand-btn font-bold">
                    ✏️ 新增行程
                </button>
            </div>

            <div class="relative pl-8 pt-3 space-y-4">
                <div class="absolute left-[15px] top-4 bottom-4 w-0 border-l-2 border-dashed border-picturebook-muted/50 z-0"></div>
                <div id="timeline-list" class="space-y-4 relative z-10"></div>
            </div>
        </div>

        <!-- TAB 2: SPOTS & MAPS -->
        <div id="tab-spots" class="tab-content hidden space-y-3">
            <div class="flex justify-between items-center mb-1">
                <h2 class="font-bold text-picturebook-ink text-sm"><i class="fa-solid fa-map-location-dot text-picturebook-mustard mr-1.5"></i>景點地圖</h2>
                <button onclick="openAddSpotModal()" class="text-xs bg-picturebook-mustard text-white px-3 py-1.5 hand-btn font-bold">+ 新增景點</button>
            </div>
            <div id="spots-list" class="grid grid-cols-2 gap-2.5"></div>
        </div>

        <!-- TAB 3: EXPENSES & SELF-CALCULATOR -->
        <div id="tab-expenses" class="tab-content hidden space-y-3">
            
            <div class="bg-picturebook-cream p-4 hand-card space-y-3">
                <div class="flex justify-between items-center">
                    <span class="text-xs font-bold text-picturebook-ink"><i class="fa-solid fa-calculator text-picturebook-sakura mr-1.5"></i>自訂分帳計算機</span>
                    <span class="text-[10px] text-picturebook-muted">即時算平分金額</span>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[10px] font-bold text-picturebook-muted block mb-1">消費總金額 (<span class="calc-currency">JPY</span>)：</label>
                        <input id="calc-amount" type="number" placeholder="例如: 6000" oninput="runSelfCalc()" class="w-full text-xs p-2 rounded-xl border border-picturebook-border focus:outline-none bg-white font-bold text-picturebook-ink">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-picturebook-muted block mb-1">平分人數：</label>
                        <input id="calc-people" type="number" value="3" min="1" oninput="runSelfCalc()" class="w-full text-xs p-2 rounded-xl border border-picturebook-border focus:outline-none bg-white font-bold text-picturebook-ink">
                    </div>
                </div>

                <div class="bg-white p-3 rounded-xl border border-picturebook-border flex justify-between items-center">
                    <div>
                        <div class="text-[10px] text-picturebook-muted font-bold">每人應付金額：</div>
                        <div id="calc-result-foreign" class="text-sm font-bold text-picturebook-sakura">0 JPY</div>
                    </div>
                    <div class="text-right">
                        <div class="text-[10px] text-picturebook-muted font-bold">折合台幣約：</div>
                        <div id="calc-result-twd" class="text-sm font-bold text-picturebook-matcha">NT$ 0</div>
                    </div>
                </div>

                <button onclick="addCalcResultToExpenses()" class="w-full bg-picturebook-sakura text-white text-xs py-2 hand-btn font-bold">
                    ➕ 將計算結果帶入消費筆記
                </button>
            </div>

            <div class="bg-picturebook-card p-3.5 hand-card">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs font-bold text-picturebook-ink"><i class="fa-solid fa-user-group text-picturebook-sakura mr-1.5"></i>旅途好夥伴</span>
                    <button onclick="manageCompanions()" class="text-[11px] text-picturebook-sakura font-bold underline">編輯夥伴</button>
                </div>
                <div id="companions-chips" class="flex flex-wrap gap-1.5 text-xs"></div>
            </div>

            <!-- Settlement Result Card -->
            <div class="bg-picturebook-card hand-card p-4">
                <div class="flex justify-between items-center mb-2.5">
                    <span class="text-xs font-bold text-picturebook-ink"><i class="fa-solid fa-scale-balanced text-picturebook-sky mr-1.5"></i>全團結算與兩兩對帳清單</span>
                    <button onclick="calculateSettlement()" class="text-[11px] bg-picturebook-sky text-white px-2.5 py-1 hand-btn font-bold">重新計算</button>
                </div>
                
                <div id="settlement-breakdown" class="text-xs space-y-1.5 mb-3 pb-2.5 border-b border-picturebook-border text-picturebook-ink"></div>
                <div id="settlement-actions" class="text-xs space-y-2 font-bold"></div>
            </div>

            <div class="flex justify-between items-center pt-1">
                <h3 class="text-xs font-bold text-picturebook-ink">📝 消費明細筆記</h3>
                <button onclick="openAddExpenseModal()" class="bg-picturebook-sakura text-white text-xs px-3 py-1.5 hand-btn font-bold">+ 手動記一筆</button>
            </div>

            <div id="expenses-list" class="space-y-2.5"></div>
        </div>

        <!-- TAB 4: CHECKLIST -->
        <div id="tab-checklist" class="tab-content hidden space-y-3">
            <div class="bg-picturebook-card p-3.5 hand-card">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-xs font-bold text-picturebook-ink"><i class="fa-solid fa-square-check text-picturebook-matcha mr-1.5"></i>出發打包檢查表</h3>
                    <button onclick="addChecklistItem()" class="text-xs bg-picturebook-matcha text-white px-3 py-1.5 hand-btn font-bold">+ 新增物品</button>
                </div>
                <div id="checklist-items" class="space-y-2 text-xs"></div>
            </div>
        </div>

    </main>

    <!-- Modal: Add Itinerary -->
    <div id="modal-add-item" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-picturebook-card w-full max-w-sm p-4 hand-card space-y-3">
            <div class="flex justify-between items-center border-b border-picturebook-border pb-2">
                <h3 class="font-bold text-sm text-picturebook-ink">✏️ 新增行程與交通</h3>
                <button onclick="closeAddItemModal()" class="text-picturebook-muted text-lg">✕</button>
            </div>

            <div>
                <label class="text-[11px] font-bold text-picturebook-muted block mb-1">選擇圖示類別：</label>
                <div id="category-selector" class="grid grid-cols-4 gap-2 text-xs"></div>
            </div>

            <div>
                <label class="text-[11px] font-bold text-picturebook-muted block mb-1">行程標題：</label>
                <input id="input-item-title" type="text" placeholder="例如: 淺草寺散策" class="w-full text-xs p-2 rounded-xl border border-picturebook-border focus:outline-none">
            </div>

            <div class="flex gap-2">
                <div class="w-1/2">
                    <label class="text-[11px] font-bold text-picturebook-muted block mb-1">選擇時間（可滑動滾輪）：</label>
                    <input id="input-item-time" type="time" value="10:00" class="w-full text-xs p-2 rounded-xl border border-picturebook-border focus:outline-none bg-white font-bold">
                </div>
                <div class="w-1/2">
                    <label class="text-[11px] font-bold text-picturebook-muted block mb-1">預估移動時間：</label>
                    <input id="input-item-transit-time" type="text" placeholder="例如: 30分鐘" class="w-full text-xs p-2 rounded-xl border border-picturebook-border focus:outline-none">
                </div>
            </div>

            <div class="flex gap-2">
                <div class="w-1/2">
                    <label class="text-[11px] font-bold text-picturebook-muted block mb-1">移動方式：</label>
                    <select id="input-item-transit-mode" class="w-full text-xs p-2 rounded-xl border border-picturebook-border focus:outline-none bg-white">
                        <option value="步行 🚶">步行 🚶</option>
                        <option value="地鐵 🚇">地鐵 🚇</option>
                        <option value="公車 🚌">公車 🚌</option>
                        <option value="計程車 🚕">計程車 🚕</option>
                        <option value="開車 🚗">開車 🚗</option>
                        <option value="其他 🚄">其他 🚄</option>
                    </select>
                </div>
                <div class="w-1/2">
                    <label class="text-[11px] font-bold text-picturebook-muted block mb-1">備註：</label>
                    <input id="input-item-note" type="text" placeholder="備註或注意事項" class="w-full text-xs p-2 rounded-xl border border-picturebook-border focus:outline-none">
                </div>
            </div>

            <button onclick="saveNewItineraryItem()" class="w-full bg-picturebook-sky text-white py-2 hand-btn font-bold text-xs mt-2">確認新增</button>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-picturebook-card border-t-2 border-picturebook-border flex justify-around py-2.5 px-2 z-30 shadow-lg rounded-t-[20px]">
        <button onclick="switchTab('itinerary')" id="nav-itinerary" class="flex flex-col items-center text-picturebook-sky tab-active">
            <i class="fa-solid fa-book-open text-lg"></i>
            <span class="text-[10px] mt-0.5 font-bold">行程</span>
        </button>
        <button onclick="switchTab('spots')" id="nav-spots" class="flex flex-col items-center text-picturebook-muted">
            <i class="fa-solid fa-compass text-lg"></i>
            <span class="text-[10px] mt-0.5 font-bold">景點</span>
        </button>
        <button onclick="switchTab('expenses')" id="nav-expenses" class="flex flex-col items-center text-picturebook-muted">
            <i class="fa-solid fa-coins text-lg"></i>
            <span class="text-[10px] mt-0.5 font-bold">記帳分帳</span>
        </button>
        <button onclick="switchTab('checklist')" id="nav-checklist" class="flex flex-col items-center text-picturebook-muted">
            <i class="fa-solid fa-list-check text-lg"></i>
            <span class="text-[10px] mt-0.5 font-bold">準備清單</span>
        </button>
    </nav>

    <script>
        const CATEGORIES = [
            { name: "美食", icon: "🍱", bg: "bg-picturebook-sakura/20 text-picturebook-sakura" },
            { name: "觀光", icon: "⛩️", bg: "bg-picturebook-mustard/20 text-picturebook-mustard" },
            { name: "交通", icon: "🚃", bg: "bg-picturebook-sky/20 text-picturebook-sky" },
            { name: "購物", icon: "🛍️", bg: "bg-picturebook-sakura/20 text-picturebook-sakura" },
            { name: "咖啡", icon: "☕", bg: "bg-picturebook-mustard/20 text-picturebook-mustard" },
            { name: "住宿", icon: "🏨", bg: "bg-picturebook-matcha/20 text-picturebook-matcha" },
            { name: "拍照", icon: "📸", bg: "bg-picturebook-sky/20 text-picturebook-sky" },
            { name: "其他", icon: "🎈", bg: "bg-picturebook-cream text-picturebook-ink" }
        ];

        let selectedCategory = CATEGORIES[0];

        let appData = {
            title: "關東秋季自由行 🍁",
            destination: "東京/日本",
            startDate: "2026-10-15",
            totalDays: 5,
            fxCode: "JPY",
            fxRate: 0.210,
            weather: { icon: "☀️", minTemp: 22, maxTemp: 26, wear: "薄外套 / 舒適穿搭" },
            companions: ["我", "夥伴A", "夥伴B"],
            selectedDay: 1,
            itinerary: [
                { id: 1, day: 1, time: "09:00", title: "抵達羽田機場", icon: "🚃", tag: "交通", tagBg: "bg-picturebook-sky/20 text-picturebook-sky", transitTime: "45分鐘", transitMode: "地鐵 🚇", note: "搭乘單軌電車前往市區飯店寄放行李", completed: false, mapUrl: "https://maps.google.com" },
                { id: 2, day: 1, time: "12:30", title: "淺草神社 & 敘敘苑燒肉", icon: "🍱", tag: "美食", tagBg: "bg-picturebook-sakura/20 text-picturebook-sakura", transitTime: "15分鐘", transitMode: "步行 🚶", note: "預約 12:30 享用商業午餐", completed: false, mapUrl: "https://maps.google.com" }
            ],
            spots: [
                { id: 1, name: "SHIBUYA SKY", desc: "預約傍晚夕陽場次看夜景", mapUrl: "https://maps.google.com" },
                { id: 2, name: "豪德寺 (招福貓)", desc: "搭乘世田谷線拍滿滿招財貓", mapUrl: "https://maps.google.com" }
            ],
            expenses: [
                { id: 1, title: "景點門票聯票", amount: 12000, payer: "夥伴A", sharedBy: ["我", "夥伴A", "夥伴B"] },
                { id: 2, title: "深夜計程車", amount: 3000, payer: "夥伴A", sharedBy: ["夥伴A", "夥伴B"] },
                { id: 3, title: "居酒屋美味晚餐", amount: 6000, payer: "我", sharedBy: ["我", "夥伴A", "夥伴B"] }
            ],
            checklist: [
                { id: 1, text: "護照與簽證文件", checked: true },
                { id: 2, text: "日幣現金與信用卡", checked: true },
                { id: 3, text: "網卡 / Wi-Fi 分享器", checked: false }
            ]
        };

        window.addEventListener('DOMContentLoaded', () => {
            loadSharedUrlData();
            loadLocalData();
            renderHeader();
            renderDaysSlider();
            renderItinerary();
            renderSpots();
            renderCompanions();
            renderExpenses();
            renderChecklist();
            calculateSettlement();
            renderCategorySelector();
            runSelfCalc();

            setTimeout(() => {
                fetchLiveExchangeRate();
                fetchLiveWeather();
            }, 200);
        });

        function saveData() { localStorage.setItem('picturebook_travel_app_v8', JSON.stringify(appData)); }
        function loadLocalData() {
            const saved = localStorage.getItem('picturebook_travel_app_v8');
            if (saved) { try { appData = JSON.parse(saved); } catch (e) {} }
        }

        function loadSharedUrlData() {
            const hash = window.location.hash;
            if (hash && hash.startsWith('#data=')) {
                try {
                    const jsonStr = decodeURIComponent(atob(hash.replace('#data=', '')));
                    const parsedData = JSON.parse(jsonStr);
                    if (parsedData && parsedData.title) {
                        appData = parsedData;
                        saveData();
                        alert('✨ 成功透過共用網址載入最新行程與帳目！');
                        window.history.replaceState(null, null, window.location.pathname);
                    }
                } catch (e) {
                    console.log('解析共用網址失敗');
                }
            }
        }

        function shareTripUrl() {
            try {
                const jsonStr = JSON.stringify(appData);
                const base64Data = btoa(encodeURIComponent(jsonStr));
                const shareUrl = `${window.location.origin}${window.location.pathname}#data=${base64Data}`;
                
                navigator.clipboard.writeText(shareUrl).then(() => {
                    alert('🔗 完整共用網址已複製！\n\n直接貼到 LINE 傳給朋友，朋友點開網址就會自動同步所有最新內容囉！');
                }).catch(() => {
                    prompt('請複製下方網址傳給朋友：', shareUrl);
                });
            } catch (e) {
                alert('資料過大，無法產生網址');
            }
        }

        async function fetchLiveExchangeRate() {
            try {
                const response = await fetch('https://api.exchangerate-api.com/v4/latest/JPY');
                const data = await response.json();
                if (data && data.rates && data.rates.TWD) {
                    appData.fxRate = data.rates.TWD;
                    saveData();

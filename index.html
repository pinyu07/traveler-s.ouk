<meta name="apple-mobile-web-app-title" content="旅行手帳">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script>
if(window.tailwind)tailwind.config={theme:{extend:{colors:{picturebook:{bg:'#FFFDF9',card:'#FFFFFF',cream:'#FFF7E6',matcha:'#859F7A',sakura:'#E8A5A5',mustard:'#E0A949',sky:'#81A3BD',lightYellow:'#FDF6E2',lightBlue:'#E6F0F7',ink:'#4A3E3D',muted:'#A0938E',border:'#E8E1D7'}},fontFamily:{hand:['"Zen Maru Gothic"','sans-serif'],title:['"Mochiy Pop One"','sans-serif']}}}}

<body class="max-w-md mx-auto min-h-screen flex flex-col justify-between relative shadow-2xl bg-picturebook-bg">

<header class="bg-gradient-to-r from-picturebook-lightYellow via-picturebook-cream to-picturebook-lightBlue text-picturebook-ink p-5 rounded-b-[28px] shadow-sm relative overflow-hidden border-b-2 border-picturebook-border">
<div class="flex justify-between items-start relative z-10"><div class="w-full">
<div class="flex items-center justify-between">
<span id="trip-dest-badge" class="bg-white/80 text-picturebook-ink text-xs px-3 py-1 rounded-full font-bold border border-picturebook-border shadow-sm cursor-pointer hover:bg-white" title="點擊編輯目的地">🇯🇵 東京/日本</span>
<div class="flex gap-1.5">
<button id="btn-edit-title" class="text-[11px] bg-white text-picturebook-sky px-2 py-1 hand-btn font-bold border border-picturebook-border flex items-center gap-1"><i class="fa-solid fa-pen"></i> 標題</button>
<button id="btn-cloud-sync" class="text-[10px] bg-picturebook-matcha text-white px-2 py-1 hand-btn font-bold" title="分享與同步行程"><i class="fa-solid fa-share-nodes mr-0.5"></i>分享同步</button>
</div></div>
<div class="mt-2"><h1 id="trip-title" class="text-2xl font-title text-picturebook-ink">關東秋季自由行 🍁</h1></div>
<p id="trip-dates-text" class="text-xs text-picturebook-muted mt-1 font-bold cursor-pointer hover:text-picturebook-sky transition inline-block"></p>
</div></div>
<div class="grid grid-cols-2 gap-2 mt-4 pt-3 border-t border-picturebook-border/60 text-xs">
<div id="card-weather-edit" class="bg-white/80 p-2 rounded-xl border border-picturebook-border flex items-center justify-between cursor-pointer hover:bg-white transition" title="點擊修改天氣">

<div class="font-bold text-picturebook-ink" id="header-weather">🍂 18°C ~ 22°C 晴時多雲</div>
<div class="text-[9px] text-picturebook-muted" id="header-weather-sub"></div></div>
<i class="fa-solid fa-cloud-sun text-picturebook-mustard text-lg"></i></div>

<div><div class="text-[10px] text-picturebook-muted font-bold flex items-center gap-1"><span id="fx-label">匯率換算 (1 JPY)</span> <i class="fa-solid fa-pen text-[9px]"></i></div>
<div class="font-bold text-picturebook-sakura" id="header-fx">約 0.210 TWD</div>
<div class="text-[9px] text-picturebook-muted" id="header-fx-sub"></div></div>
<i class="fa-solid fa-coins text-picturebook-sakura text-lg"></i></div>
</div>
</header>

<div class="px-4 mt-3"><div id="day-slider" class="flex gap-2 overflow-x-auto hide-scrollbar py-1"></div></div>

<main class="flex-1 px-4 py-2 pb-24 overflow-y-auto">
<div id="tab-itinerary" class="tab-content space-y-3">
<div class="flex justify-between items-center px-1 pt-1">
<h2 class="font-bold text-picturebook-ink text-sm"><i class="fa-solid fa-list-ul text-picturebook-sky mr-1.5"></i>行程時間軸</h2>
<button id="btn-add-item" class="text-xs bg-picturebook-sky text-white px-3.5 py-2 hand-btn font-bold">✏️ 新增行程</button></div>
<div class="relative pl-8 pt-3 space-y-4">
<div class="absolute left-[15px] top-4 bottom-4 w-0 border-l-2 border-dashed border-picturebook-muted/50 z-0"></div>
<div id="timeline-list" class="space-y-4 relative z-10"></div></div>
</div>

<div id="tab-spots" class="tab-content hidden space-y-3">

<div id="companions-chips" class="flex flex-wrap gap-1.5 text-xs"></div></div>
<div class="bg-picturebook-card hand-card p-4">

<div id="tab-checklist" class="tab-content hidden space-y-3">

<select id="select-tax-currency" class="text-xs p-2 rounded-xl border border-picturebook-border bg-white font-bold text-picturebook-ink">
<option value="JPY">🇯🇵 JPY</option><option value="KRW">🇰🇷 KRW</option><option value="USD">🇺🇸 USD</option><option value="EUR">🇪🇺 EUR</option><option value="THB">🇹🇭 THB</option><option value="VND">🇻🇳 VND</option><option value="SGD">🇸🇬 SGD</option><option value="HKD">🇭🇰 HKD</option></select>
<input id="input-tax-calc" type="number" placeholder="輸入當地金額" class="flex-1 text-xs p-2 rounded-xl border border-picturebook-border focus:outline-none font-bold">
<button id="btn-calc-tax" class="bg-picturebook-mustard text-white text-xs px-3.5 py-2 hand-btn font-bold">試算</button></div>
<div id="tax-calc-results" class="grid grid-cols-3 gap-2 text-center text-xs hidden">
<div class="bg-picturebook-cream/60 p-2 rounded-xl border border-picturebook-border"><div class="text-[10px] text-picturebook-muted font-bold">未稅標價</div><div id="res-tax-free" class="font-bold text-picturebook-ink mt-0.5">-</div><div id="res-tax-free-twd" class="text-[9px] text-picturebook-muted">-</div></div>
<div class="bg-picturebook-cream/60 p-2 rounded-xl border border-picturebook-border"><div class="text-[10px] text-picturebook-muted font-bold">含稅 8%</div><div id="res-tax-8" class="font-bold text-picturebook-ink mt-0.5">-</div><div id="res-tax-8-twd" class="text-[9px] text-picturebook-muted">-</div></div>
<div class="bg-picturebook-cream/60 p-2 rounded-xl border border-picturebook-border"><div class="text-[10px] text-picturebook-muted font-bold">含稅 10%</div><div id="res-tax-10" class="font-bold text-picturebook-sakura mt-0.5">-</div><div id="res-tax-10-twd" class="text-[9px] text-picturebook-muted">-</div></div>
</div></div>

<div class="bg-picturebook-card p-4 hand-card space-y-3">
<div class="flex justify-between items-center border-b border-picturebook-border pb-2">
<h3 class="text-xs font-bold text-picturebook-ink"><i class="fa-solid fa-plane text-picturebook-sky mr-1.5"></i>航班與交通資訊</h3>
<button id="btn-edit-flight" class="text-[11px] text-picturebook-sky font-bold underline">編輯資訊</button></div>
<div class="text-xs space-y-2 text-picturebook-ink">
<div class="flex justify-between"><span class="text-picturebook-muted font-bold">去程航班：</span><span id="info-flight-go" class="font-bold"></span></div>
<div class="flex justify-between"><span class="text-picturebook-muted font-bold">回程航班：</span><span id="info-flight-back" class="font-bold"></span></div>
<div class="flex justify-between border-t border-picturebook-border/50 pt-1.5"><span class="text-picturebook-muted font-bold">租車資訊：</span><span id="info-rental" class="font-bold"></span></div>
</div></div>

<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<h3 class="text-xs font-bold text-picturebook-ink"><i class="fa-solid fa-house-user text-picturebook-sakura mr-1.5"></i>住宿飯店與包棟資訊</h3>
<button id="btn-add-hotel" class="text-xs bg-picturebook-sakura text-white px-3 py-1.5 hand-btn font-bold">+ 新增住宿</button></div>
<div id="hotels-list" class="space-y-3"></div></div>

<div class="bg-picturebook-card p-4 hand-card space-y-2.5">
<h3 class="text-xs font-bold text-picturebook-ink"><i class="fa-solid fa-shield-heart text-picturebook-matcha mr-1.5"></i>資料備份與重置</h3>
<p id="backup-info" class="text-[11px] text-picturebook-muted"></p>
<div class="grid grid-cols-2 gap-2">
<button id="btn-export" class="text-xs bg-picturebook-matcha text-white py-2 hand-btn font-bold">⬇️ 匯出備份檔</button>
<button id="btn-import" class="text-xs bg-picturebook-sky text-white py-2 hand-btn font-bold">⬆️ 匯入備份檔</button></div>
<input id="file-import" type="file" accept=".json,application/json" class="hidden">
<button id="btn-reset" class="w-full text-xs bg-white text-picturebook-sakura border border-picturebook-sakura/50 py-2 hand-btn font-bold">🗑️ 清空並開始新旅程</button>
<p class="text-[10px] text-picturebook-muted">iPhone 請先用 Safari「加入主畫面」，資料才不會因為太久沒開而被系統清掉。</p></div>
</div>
</main>

<div id="modal-add-item" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
<div class="bg-picturebook-card w-full max-w-sm p-4 hand-card space-y-3 max-h-[90vh] overflow-y-auto">
<div class="flex justify-between items-center border-b border-picturebook-border pb-2">
<h3 id="modal-itinerary-title" class="font-bold text-sm text-picturebook-ink">✏️ 新增行程與交通</h3>
<button id="btn-close-modal" class="text-picturebook-muted text-lg">✕</button></div>
<div><label class="text-[11px] font-bold text-picturebook-muted block mb-1">選擇圖示類別：</label><div id="category-selector" class="grid grid-cols-4 gap-2 text-xs"></div></div>
<div><label class="text-[11px] font-bold text-picturebook-muted block mb-1">自訂圖示（可留空；點下面快選，或用手機鍵盤輸入任何 emoji）：</label>
<input id="input-item-icon" type="text" maxlength="12" placeholder="例如: 🍜" class="w-full p-2 rounded-xl border border-picturebook-border focus:outline-none bg-white text-center text-base">
<div id="icon-quicks" class="flex flex-wrap gap-1.5 mt-1.5"></div></div>
<div><label class="text-[11px] font-bold text-picturebook-muted block mb-1">行程標題/地點：</label>
<input id="input-item-title" type="text" placeholder="例如: 淺草寺散策" class="w-full text-xs p-2 rounded-xl border border-picturebook-border focus:outline-none bg-white"></div>
<div class="flex gap-2">
<div class="w-1/2"><label class="text-[11px] font-bold text-picturebook-muted block mb-1">預計時間：</label>
<input id="input-item-time" type="time" value="10:00" class="w-full text-xs p-2 rounded-xl border border-picturebook-border focus:outline-none bg-white font-bold"></div>
<div class="w-1/2"><label class="text-[11px] font-bold text-picturebook-muted block mb-1">停留時間 (可選或手輸)：</label>
<input id="input-item-duration" list="duration-options" type="text" placeholder="例如: 1小時" class="w-full text-xs p-2 rounded-xl border border-picturebook-border focus:outline-none bg-white font-bold">
<datalist id="duration-options"><option value="30分鐘"><option value="1小時"><option value="1.5小時"><option value="2小時"><option value="2.5小時"><option value="3小時"><option value="半天"><option value="整天"></datalist></div>
</div>
<div><label class="text-[11px] font-bold text-picturebook-muted block mb-1">前往下一站通勤方式：</label>
<select id="input-item-transit" class="w-full text-xs p-2 rounded-xl border border-picturebook-border focus:outline-none bg-white font-bold">
<option value="">無/不指定</option><option value="🚶 步行">🚶 步行</option><option value="🚃 電車/地鐵">🚃 電車/地鐵</option><option value="🚌 公車/巴士">🚌 公車/巴士</option><option value="🚕 計程車">🚕 計程車</option><option value="🚗 自駕車行">🚗 自駕車行</option><option value="🚄 新幹線/特急">🚄 新幹線/特急</option></select></div>
<div><label class="text-[11px] font-bold text-picturebook-muted block mb-1">交通說明（怎麼抵達下一站，可留空）：</label>
<input id="input-item-route" type="text" placeholder="例如: 搭銀座線到淺草站，3號出口步行5分" class="w-full text-xs p-2 rounded-xl border border-picturebook-border focus:outline-none bg-white"></div>
<div><label class="text-[11px] font-bold text-picturebook-muted block mb-1">當地文字名稱（給司機看，可留空）：</label>
<input id="input-item-local" type="text" placeholder="例如: 浅草寺" class="w-full text-xs p-2 rounded-xl border border-picturebook-border focus:outline-none bg-white"></div>
<div><label class="text-[11px] font-bold text-picturebook-muted block mb-1">備註：</label>
<input id="input-item-note" type="text" placeholder="備註或注意事項" class="w-full text-xs p-2 rounded-xl border border-picturebook-border focus:outline-none bg-white"></div>
<button id="btn-save-item" class="w-full bg-picturebook-sky text-white py-2 hand-btn font-bold text-xs mt-2">儲存行程</button>
</div></div>

<nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-picturebook-card border-t-2 border-picturebook-border flex justify-around py-2.5 px-1 z-30 shadow-lg rounded-t-[20px]">
<button id="nav-itinerary" class="flex flex-col items-center text-picturebook-sky tab-active"><i class="fa-solid fa-book-open text-base"></i><span class="text-[9px] mt-0.5 font-bold">行程</span></button>
<button id="nav-spots" class="flex flex-col items-center text-picturebook-muted"><i class="fa-solid fa-compass text-base"></i><span class="text-[9px] mt-0.5 font-bold">景點</span></button>
<button id="nav-expenses" class="flex flex-col items-center text-picturebook-muted"><i class="fa-solid fa-coins text-base"></i><span class="text-[9px] mt-0.5 font-bold">記帳分帳</span></button>
<button id="nav-checklist" class="flex flex-col items-center text-picturebook-muted"><i class="fa-solid fa-list-check text-base"></i><span class="text-[9px] mt-0.5 font-bold">清單</span></button>
<button id="nav-toolbox" class="flex flex-col items-center text-picturebook-muted"><i class="fa-solid fa-toolbox text-base"></i><span class="text-[9px] mt-0.5 font-bold">工具箱</span></button>

<script src="firebase-config.js"></script>
<script>
const FB_ON=!!(typeof FIREBASE_CONFIG!=='undefined'&&FIREBASE_CONFIG.apiKey); // 設定放在 firebase-config.js
const FB={db:null,unsub:null,timer:null,room:localStorage.getItem('pb_fb_room')||'',codes:()=>localStorage.getItem('pb_fb_codes')==='1'};
const CATEGORIES=[
{name:"美食",icon:"🍱",bg:"bg-picturebook-sakura/20 text-picturebook-sakura"},
{name:"觀光",icon:"⛩️",bg:"bg-picturebook-mustard/20 text-picturebook-mustard"},

/* ---------- 日期工具 (本地時區，避免差一天) ---------- */
const pad=n=>String(n).padStart(2,'0');
function parseLocal(s){const m=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec((s||'').trim());return m?new Date(+m[1],+m[2]-1,+m[3]):null}
function fmtYMD(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function startDateObj(){return parseLocal(appData.startDate)||new Date(new Date().setHours(0,0,0,0))}
function todayDayNumber(){ // 今天是旅程第幾天；不在旅程內回傳 0
 const t=new Date();t.setHours(0,0,0,0);
 const n=Math.round((t-startDateObj())/86400000)+1;
 return (n>=1&&n<=appData.totalDays)?n:0}

async function fetchRateTable(){
 try{const r=await fetch('https://open.er-api.com/v6/latest/TWD');const j=await r.json();
  if(j&&j.result==='success'&&j.rates)return{rates:j.rates,date:(j.time_last_update_utc||'').slice(5,16)}}catch(e){}

  if(j&&j.rates)return{rates:j.rates,date:j.date}}catch(e){}

function rateOf(code){ // 1 外幣 = ? TWD
 if(code==='TWD')return 1;
 const t=appData.fxTable&&appData.fxTable[code];
 return t?1/t:null}

const normPlace=t=>String(t||'').replace(/臺/g,'台');
function localPlace(q){ // 先查內建常用地點，不靠網路搜尋
 const parts=normPlace(q).split(/[\/／,，、\s]+/).filter(Boolean),keys=Object.keys(PLACES).sort((a,b)=>b.length-a.length);
 for(const part of parts)for(const k of keys)if(part.includes(k))return PLACES[k];
 return null}
async function geocode(){
 const src=appData.weatherPlace||appData.destination;
 if(appData.geo&&appData.geo.q===src)return appData.geo;
 const lp=localPlace(src);
 if(lp){appData.geo={q:src,lat:lp[0],lon:lp[1]};return appData.geo}
 const parts=src.split(/[\/／,，、]/).map(x=>x.trim().replace(/臺/g,'台')).filter(Boolean);
 const qs=[];
 parts.forEach(x=>{if(GEO_ALIAS[x])qs.push([GEO_ALIAS[x],'en']);qs.push([x,'zh']);const u=x.replace(/[市縣區]$/,'');if(u!==x)qs.push([u,'zh'])});
 qs.push([src,'en']); // 直接輸入英文城市名也可以 (例: Taipei)
 for(const [q,l] of qs){
  try{const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=${l}`);const j=await r.json();
   if(j.results&&j.results[0]){const g=j.results[0];appData.geo={q:src,lat:g.latitude,lon:g.longitude};return appData.geo}}catch(e){}}
 return null}

 try{

function b64u(u8){let s='';u8.forEach(b=>s+=String.fromCharCode(b));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function unb64u(str){str=str.replace(/-/g,'+').replace(/_/g,'/');while(str.length%4)str+='=';return Uint8Array.from(atob(str),c=>c.charCodeAt(0))}
let shareWithCodes=false;
function sharePayload(inc){if(inc===undefined)inc=shareWithCodes;const d=JSON.parse(JSON.stringify(appData));delete d.fxTable;delete d.wDaily;if(!inc)(d.hotels||[]).forEach(h=>h.code='');d.updatedAt=appData.updatedAt||Date.now();return d}
async function encodeTrip(obj){
 const bytes=new TextEncoder().encode(JSON.stringify(obj));
 if(window.CompressionStream){
  const cs=new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'));
  return 'z'+b64u(new Uint8Array(await new Response(cs).arrayBuffer()))}
 return 'r'+b64u(bytes)}
async function decodeTrip(code){
 code=code.trim();const u8=unb64u(code.slice(1));let bytes=u8;
 if(code[0]==='z'){
  if(!window.DecompressionStream)throw new Error('瀏覽器不支援');
  const ds=new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip'));
  bytes=new Uint8Array(await new Response(ds).arrayBuffer())}
 return JSON.parse(new TextDecoder().decode(bytes))}

function fmtTime(ts){if(!ts)return'未知';const d=new Date(ts);return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`}
function mergeData(mine,t){
 const m=JSON.parse(JSON.stringify(mine));
 const base=(t.updatedAt||0)>=(m.updatedAt||0)?Object.assign({},m,t):Object.assign({},t,m);
 const del=new Set([...(m.deleted||[]),...(t.deleted||[])]);
 LISTS.forEach(k=>{
  const map=new Map();(m[k]||[]).forEach(x=>map.set(x.id,x));
  (t[k]||[]).forEach(x=>{const o=map.get(x.id);
   if(!o||(x.u||0)>=(o.u||0)){map.set(x.id,(k==='hotels'&&o&&!x.code)?{...x,code:o.code}:x)}
   else if(k==='hotels'&&!o.code&&x.code)o.code=x.code});
  base[k]=[...map.values()].filter(x=>!del.has(x.id))});
 base.deleted=[...del];
 base.updatedAt=Math.max(m.updatedAt||0,t.updatedAt||0);return base}
function applyImported(data,label){
 if(!data||!data.itinerary||!data.title)throw new Error('資料格式不正確');
 data=normalizeData(sanitizeImported(data));
 const mine=appData.updatedAt||0,theirs=data.updatedAt||0;
 let msg=`收到「${data.title}」（${label}，最後修改 ${fmtTime(theirs)}）。\n你目前的版本最後修改 ${fmtTime(mine)}。`;
 if(theirs&&mine&&theirs<mine)msg+='\n⚠️ 對方的版本比你的舊。';
 const c=prompt(msg+'\n\n1 = 合併（保留雙方新增的項目；相同項目以對方為準；對方刪除的項目不會同步）\n2 = 整份覆蓋成對方的版本\n其他 = 取消','1');
 if(c!=='1'&&c!=='2')return false;
 const oldCodes={};appData.hotels.forEach(h=>oldCodes[h.id]=h.code);
 const keep={fxTable:appData.fxTable,fxUpdated:appData.fxUpdated};
 appData=c==='1'?mergeData(appData,data):data;
 Object.assign(appData,keep);
 appData.hotels.forEach(h=>{if(!h.code&&oldCodes[h.id])h.code=oldCodes[h.id]});
 appData.selectedDay=todayDayNumber()||1;
 snap();saveQuiet();renderAll();refreshRates(false);refreshWeather(false);return true}
async function checkHashImport(){
 const f=/^#fb=([\w-]+)$/.exec(location.hash),r=/^#room=([\w-]+)$/.exec(location.hash),m=/^#trip=(.+)$/.exec(location.hash);
 if(!f&&!r&&!m)return;
 history.replaceState(null,'',location.pathname+location.search);
 try{if(f)await fbJoin(f[1]);else if(r)await joinRoom(r[1]);else applyImported(await decodeTrip(m[1]),'分享連結')}catch(e){alert('無法讀取分享內容：'+(e.message||e))}}
async function shareOrCopy(title,text,url){ // 手機分享選單；不支援時退回複製
 if(navigator.share){try{await navigator.share({title,text,url});return}catch(e){if(e&&e.name==='AbortError')return}}
 await copyText(url,'✨ 已複製分享連結！傳給朋友即可。')}
const CLOUD='https://jsonblob.com/api/jsonBlob',JH={'Content-Type':'application/json','Accept':'application/json'};
const roomId=()=>localStorage.getItem('pb_cloud_id');
function setSyncLabel(t){const b=document.getElementById('btn-cloud-sync');if(b)b.innerHTML=t?`<i class="fa-solid fa-cloud mr-0.5"></i>${t}`:'<i class="fa-solid fa-share-nodes mr-0.5"></i>分享同步'}
const cloudCodes=()=>localStorage.getItem('pb_cloud_codes')==='1';
async function cloudGet(id){const r=await fetch(`${CLOUD}/${id}`,{headers:{Accept:'application/json'}});if(!r.ok)throw new Error('找不到這個房間（代號錯誤或已失效）');return r.json()}
async function cloudPut(id){const r=await fetch(`${CLOUD}/${id}`,{method:'PUT',headers:JH,body:JSON.stringify(sharePayload(cloudCodes()))});if(!r.ok)throw new Error('上傳失敗')}
async function cloudCreate(){
 const r=await fetch(CLOUD,{method:'POST',headers:JH,body:JSON.stringify(sharePayload(cloudCodes()))});
 const id=(r.headers.get('Location')||r.headers.get('X-jsonblob')||'').split('/').pop();
 if(!r.ok||!id)throw new Error('雲端沒有回傳房間代號（此服務可能不支援）。請改用「複製分享代碼」。');
 localStorage.setItem('pb_cloud_id',id);return id}
let syncing=false,syncTimer=null;
function scheduleSync(){if(FB_ON){if(!FB.room)return;clearTimeout(FB.timer);FB.timer=setTimeout(fbPush,1200);return}if(!roomId())return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncNow(true),4000)}
async function syncNow(silent){ // 下載雲端 → 合併 → 上傳
 const id=roomId();if(!id||syncing)return;syncing=true;setSyncLabel('同步中…');
 try{
  const cloud=normalizeData(sanitizeImported(await cloudGet(id)));
  const keep={fxTable:appData.fxTable,fxUpdated:appData.fxUpdated},sel=appData.selectedDay;
  appData=mergeData(appData,cloud);Object.assign(appData,keep);appData.selectedDay=sel>appData.totalDays?1:sel;
  snap();saveQuiet();renderAll();
  await cloudPut(id);
  const d=new Date();setSyncLabel(`已同步 ${pad(d.getHours())}:${pad(d.getMinutes())}`);
 }catch(e){setSyncLabel('⚠️ 離線');if(!silent)alert('同步失敗：'+(e.message||e))}
 syncing=false}
async function joinRoom(id){
 id=(id||'').trim();if(!id)return;
 const cloud=normalizeData(sanitizeImported(await cloudGet(id)));
 if(!confirm(`加入房間後，這支手機目前的行程會被雲端的「${cloud.title}」取代。確定嗎？`))return;
 const keep={fxTable:appData.fxTable,fxUpdated:appData.fxUpdated};
 appData=Object.assign(cloud,keep);appData.selectedDay=todayDayNumber()||1;
 localStorage.setItem('pb_cloud_id',id);
 localStorage.setItem('pb_cloud_codes',(appData.hotels||[]).some(h=>h.code)?'1':'0');
 snap();saveQuiet();renderAll();refreshRates(false);refreshWeather(false);setSyncLabel('已加入')}
/* ---------- Firebase 即時同步 ---------- */
function loadScript(src){return new Promise((res,rej)=>{const e=document.createElement('script');e.src=src;e.onload=res;e.onerror=()=>rej(new Error('載入 Firebase 失敗，請確認網路'));document.head.appendChild(e)})}
let fbReadyP=null;
function fbReady(){
 if(!FB_ON)return Promise.reject(new Error('尚未設定 Firebase（請照 FIREBASE_SETUP.md 設定）'));
 if(fbReadyP)return fbReadyP;
 fbReadyP=(async()=>{
  const B='https://www.gstatic.com/firebasejs/10.12.2/';
  await loadScript(B+'firebase-app-compat.js');
  await Promise.all([loadScript(B+'firebase-auth-compat.js'),loadScript(B+'firebase-firestore-compat.js')]);
  firebase.initializeApp(FIREBASE_CONFIG);
  FB.db=firebase.firestore();
  try{await FB.db.enablePersistence({synchronizeTabs:true})}catch(e){} // 離線也能用
  await firebase.auth().signInAnonymously();
 })();
 fbReadyP.catch(()=>{fbReadyP=null});
 return fbReadyP}
function cleanPayload(src,inc){const d=JSON.parse(JSON.stringify(src));delete d.fxTable;delete d.wDaily;if(!inc)(d.hotels||[]).forEach(h=>h.code='');return d}
const tripRef=()=>FB.db.collection('trips').doc(FB.room);
const parseTrip=doc=>normalizeData(sanitizeImported(JSON.parse(doc.data().json)));
async function fbPush(){ // 以交易方式「讀取遠端→合併→寫回」，兩人同時改也不會互蓋
 if(!FB_ON||!FB.room)return;
 try{
  await fbReady();setSyncLabel('同步中…');
  await FB.db.runTransaction(async tx=>{
   const doc=await tx.get(tripRef());
   const merged=doc.exists?mergeData(appData,parseTrip(doc)):appData;
   tx.set(tripRef(),{json:JSON.stringify(cleanPayload(merged,FB.codes())),updatedAt:merged.updatedAt||Date.now()})});
  const d=new Date();setSyncLabel(`已同步 ${pad(d.getHours())}:${pad(d.getMinutes())}`);
 }catch(e){setSyncLabel('⚠️ 離線')}}
function localAhead(m,r){ // 我這邊有沒有雲端還沒有的項目、修改或刪除？
 for(const k of LISTS){const rm=new Map((r[k]||[]).map(x=>[x.id,x]));
  for(const x of (m[k]||[])){const y=rm.get(x.id);if(!y||(x.u||0)>(y.u||0))return true}}
 const rd=new Set(r.deleted||[]);return (m.deleted||[]).some(id=>!rd.has(id))}
function fbApply(remote){
 const keep={fxTable:appData.fxTable,fxUpdated:appData.fxUpdated},sel=appData.selectedDay;
 const needPush=localAhead(appData,remote)||(appData.updatedAt||0)>(remote.updatedAt||0);
 appData=mergeData(appData,remote);Object.assign(appData,keep);appData.selectedDay=sel>appData.totalDays?1:sel;
 snap();saveQuiet();renderAll();
 if(needPush)scheduleSync()}
function fbListen(){
 if(FB.unsub)FB.unsub();
 FB.unsub=tripRef().onSnapshot(doc=>{
  if(!doc.exists||doc.metadata.hasPendingWrites)return;
  try{fbApply(parseTrip(doc));const d=new Date();setSyncLabel(`已同步 ${pad(d.getHours())}:${pad(d.getMinutes())}`)}catch(e){}
 },()=>setSyncLabel('⚠️ 離線'))}
async function fbStart(){
 if(!FB.room){setSyncLabel('');return}
 try{await fbReady();fbListen();setSyncLabel('已連線');fbPush()}catch(e){setSyncLabel('⚠️ 離線')}} // 開啟時把離線期間的修改補傳上去
window.addEventListener('online',()=>{if(FB_ON&&FB.room)fbPush()}); // 網路恢復時補傳

  const room=Array.from(crypto.getRandomValues(new Uint8Array(10)),b=>'abcdefghjkmnpqrstuvwxyz23456789'[b%31]).join('');
  await FB.db.collection('trips').doc(room).set({json:JSON.stringify(cleanPayload(appData,FB.codes())),updatedAt:appData.updatedAt||Date.now()});
  FB.room=room;localStorage.setItem('pb_fb_room',room);fbListen();setSyncLabel('已建立')}

async function fbJoin(room){
 room=(room||'').trim();if(!room)return;

 if(!doc.exists)throw new Error('找不到這個旅程（代號錯誤）');

 if(!confirm(`加入後，這支手機目前的行程會被「${remote.title}」取代。確定嗎？`))return;
 const keep={fxTable:appData.fxTable,fxUpdated:appData.fxUpdated};
 appData=Object.assign(remote,keep);appData.selectedDay=todayDayNumber()||1;
 FB.room=room;localStorage.setItem('pb_fb_room',room);
 localStorage.setItem('pb_fb_codes',(appData.hotels||[]).some(h=>h.code)?'1':'0');
 snap();saveQuiet();renderAll();refreshRates(false);refreshWeather(false);fbListen();setSyncLabel('已加入')}

async function exportBackup(){
 const d=JSON.parse(JSON.stringify(appData));delete d.fxTable;delete d.wDaily;
 const name=`旅行備份_${(appData.title||'trip').replace(/[^\w\u4e00-\u9fff-]+/g,'_')}_${fmtYMD(new Date())}.json`;
 const file=new File([JSON.stringify(d)],name,{type:'application/json'});
 try{
  if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],title:name});
  else{const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
  localStorage.setItem('pb_last_backup',Date.now());renderToolbox();
 }catch(e){if(!e||e.name!=='AbortError')alert('匯出失敗：'+(e.message||e))}}
function importBackup(e){

 r.onload=()=>{try{applyImported(JSON.parse(r.result),'備份檔')}catch(err){alert('備份檔無法讀取：'+(err.message||err))}};
 r.readAsText(f)}

function renderHeader(){

function editWeather(){
 askForm('🌤️ 天氣設定',[{k:'mode',label:'天氣來源',type:'select',options:[['auto','🌐 自動抓當地天氣（依目的地與日期，自動更新）'],['manual','✋ 手動輸入']],value:appData.weatherAuto?'auto':'manual'},{k:'place',label:'查天氣的地點（可留空，預設用目的地；找不到時填城市名，如 台北 或 Taipei）',value:appData.weatherPlace||''},{k:'text',label:'手動天氣文字（選手動才會用到）',value:appData.weatherAuto?'':appData.weatherText}],v=>{

function dayWeather(){ // 目前選到的那一天的天氣
 if(!appData.weatherAuto||!appData.wDaily)return null;
 const d=startDateObj();d.setDate(d.getDate()+appData.selectedDay-1);
 const e=appData.wDaily.find(x=>x.d===fmtYMD(d));if(!e)return null;
 const w=wmo(e.c);return{text:`${w[0]} ${Math.round(e.mn)}°C ~ ${Math.round(e.mx)}°C ${w[1]}`}}
function openTripTitleEditModal(){
 askForm('✏️ 旅程名稱與目的地',[{k:'t',label:'旅程名稱',value:appData.title},{k:'d',label:'目的地 (例如: 大阪/日本)',value:appData.destination}],v=>{
  if(v.t)appData.title=v.t;
  if(v.d&&v.d!==appData.destination){appData.destination=v.d;appData.geo=null;appData.weatherPlace='';appData.wDaily=null;

  const sb=v.sharedBy.split(/[,，]/).map(x=>x.trim()).filter(Boolean),bad=sb.filter(x=>!P.includes(x));
  if(bad.length||!sb.length){alert('平分名單有不在夥伴中的名字：'+bad.join(', '));return false}
  const rec={title:v.title,amount,cur:(v.cur||appData.fxCode).toUpperCase(),payer:v.payer,sharedBy:sb};
  if(it.id)Object.assign(appData.expenses.find(e=>e.id===it.id),rec);else appData.expenses.push({id:Date.now(),...rec});
  saveData();renderExpenses();calculateSettlement()})}
function openAddExpenseModal(){expenseForm({title:'',amount:'',payer:appData.companions[0],sharedBy:appData.companions})}
function editExpense(id){const it=appData.expenses.find(e=>e.id===id);if(it)expenseForm(it)}
function deleteExpense(id){tomb(id);appData.expenses=appData.expenses.filter(e=>e.id!==id);saveData();renderExpenses();calculateSettlement()}
function calculateSettlement(){ // 全部換算成台幣結算
 const bd=document.getElementById('settlement-breakdown'),act=document.getElementById('settlement-actions');
 if(!bd||!act)return;bd.innerHTML='';act.innerHTML='';
 if(!appData.expenses.length){bd.innerHTML=`<div class="text-picturebook-muted">目前尚未記錄任何支出</div>`;return}
 let total=0,warn=0;const noRate=new Set();const paid={},owe={},pw={},P=appData.companions;
 P.forEach(a=>{paid[a]=0;owe[a]=0;pw[a]={};P.forEach(b=>{if(a!==b)pw[a][b]=0})});
 appData.expenses.forEach(e=>{
  const amt=twdOf(e);total+=amt;{const c=e.cur||appData.fxCode;if(c!=='TWD'&&c!==appData.fxCode&&!rateOf(c))noRate.add(c)}
  const vs=e.sharedBy.filter(x=>P.includes(x));
  if(paid[e.payer]===undefined||vs.length!==e.sharedBy.length)warn++;
  if(paid[e.payer]!==undefined)paid[e.payer]+=amt;
  const per=amt/(vs.length||1);
  vs.forEach(x=>{owe[x]+=per;if(x!==e.payer&&pw[x]&&pw[x][e.payer]!==undefined)pw[x][e.payer]+=per})});
 bd.innerHTML=`<div class="flex justify-between items-center font-bold border-b border-picturebook-border pb-1.5 mb-2"><span>全團總支出 (換算台幣):</span><span class="text-picturebook-sakura font-bold">NT$ ${Math.round(total).toLocaleString()}</span></div>`
  +(noRate.size?`<div class="text-[11px] text-picturebook-sakura font-bold mb-1">⚠️ ${[...noRate].join('、')} 目前查不到匯率，暫以 1:1 計算，請連網後重新開啟更新匯率。</div>`:'')
  +(warn?`<div class="text-[11px] text-picturebook-sakura font-bold mb-1">⚠️ 有 ${warn} 筆消費的人名不在夥伴名單中，結算可能漏算，請編輯該筆。</div>`:'');
 P.forEach(p=>{const net=paid[p]-owe[p];const r=document.createElement('div');r.className="flex justify-between items-center text-[11px] mb-1";
  r.innerHTML=`<span><strong>${p}</strong> (已墊: ${Math.round(paid[p]).toLocaleString()} / 應付: ${Math.round(owe[p]).toLocaleString()})</span><span class="${net>=0?'text-picturebook-matcha font-bold':'text-picturebook-sakura font-bold'}">${net>=0?'淨收 +':'淨付 '}NT$ ${Math.round(net).toLocaleString()}</span>`;bd.appendChild(r)});
 const pairs=[],seen=new Set();
 P.forEach(a=>P.forEach(b=>{if(a!==b&&!seen.has(`${b}-${a}`)){seen.add(`${a}-${b}`);const d=(pw[a][b]||0)-(pw[b][a]||0);
  if(d>1)pairs.push({debtor:a,creditor:b,amount:d});else if(d<-1)pairs.push({debtor:b,creditor:a,amount:-d})}}));
 act.innerHTML=`<div class="text-[11px] font-bold text-picturebook-ink mb-1 mt-2">🤝 直接轉帳對帳清單 (台幣)：</div>`;
 if(!pairs.length)act.innerHTML+=`<div class="text-picturebook-matcha font-bold mt-1">✨ 大家帳目剛好平衡，無須互相轉帳！</div>`;
 else pairs.forEach(it=>{const d=document.createElement('div');
  d.className="bg-white p-2.5 rounded-xl border border-picturebook-border flex items-center justify-between text-picturebook-ink shadow-sm mb-1.5";
  d.innerHTML=`<span>💳 <strong class="text-picturebook-sakura">${it.debtor}</strong> 應付給 <strong class="text-picturebook-sky">${it.creditor}</strong></span><span class="text-picturebook-sakura font-bold">NT$ ${Math.round(it.amount).toLocaleString()}</span>`;act.appendChild(d)})}

/* ---------- 清單 ---------- */
function renderChecklist(){
 const c=document.getElementById('checklist-items');if(!c)return;c.innerHTML='';
 appData.checklist.forEach(it=>{const r=document.createElement('div');r.className="flex items-center justify-between p-2 rounded-xl bg-picturebook-cream/60 border border-picturebook-border";
  r.innerHTML=`<label class="flex items-center gap-2 cursor-pointer flex-1"><input type="checkbox" ${it.checked?'checked':''} class="chk-item rounded text-picturebook-matcha" data-id="${it.id}"><span class="${it.checked?'line-through text-picturebook-muted':'text-picturebook-ink'} font-bold">${it.text}</span></label><button class="btn-del-chk text-picturebook-muted hover:text-picturebook-sakura text-xs px-1" data-id="${it.id}"><i class="fa-solid fa-xmark"></i></button>`;c.appendChild(r)});
 c.querySelectorAll('.chk-item').forEach(k=>k.addEventListener('change',e=>toggleChecklist(Number(e.currentTarget.dataset.id))));
 c.querySelectorAll('.btn-del-chk').forEach(b=>b.addEventListener('click',e=>deleteChecklist(Number(e.currentTarget.dataset.id))))}
function toggleChecklist(id){const i=appData.checklist.find(x=>x.id===id);if(i){i.checked=!i.checked;saveData();renderChecklist()}}
function addChecklistItem(){const t=prompt("請輸入準備項目:");if(t){appData.checklist.push({id:Date.now(),text:t,checked:false});saveData();renderChecklist()}}
function deleteChecklist(id){tomb(id);appData.checklist=appData.checklist.filter(i=>i.id!==id);saveData();renderChecklist()}

/* ---------- 工具箱 ---------- */
function renderToolbox(){
 const bi=document.getElementById('backup-info');if(bi){const t=+localStorage.getItem('pb_last_backup');bi.innerText=t?`上次備份：${fmtTime(t)}`:'尚未備份過。建議出發前先匯出一份。'}
 const rb=document.getElementById('tax-calc-rate-badge');if(rb)rb.innerText=`1 ${appData.fxCode||'JPY'} ≈ ${appData.fxRate||0.21} TWD`;
 const set=(id,v)=>{const e=document.getElementById(id);if(e)e.innerText=v||"未設定"};
 set('info-flight-go',appData.flightGo);set('info-flight-back',appData.flightBack);set('info-rental',appData.rentalInfo);
 const sc=document.getElementById('select-tax-currency');
 if(sc&&appData.fxCode){if(!sc.dataset.built){sc.innerHTML=curOptions(appData.fxCode).map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('');sc.dataset.built=1}sc.value=appData.fxCode}
 renderHotelsList()}
function renderHotelsList(){
 const list=document.getElementById('hotels-list');if(!list)return;list.innerHTML='';
 if(!appData.hotels.length){list.innerHTML=`<div class="text-center py-4 text-xs text-picturebook-muted bg-picturebook-card p-3 hand-card">尚無住宿資料，點擊右上角新增</div>`;return}
 appData.hotels.forEach((h,idx)=>{const c=document.createElement('div');c.className="bg-picturebook-card p-4 hand-card space-y-2";
  c.innerHTML=`<div class="flex justify-between items-center border-b border-picturebook-border pb-1.5"><span class="text-xs font-bold text-picturebook-sakura">🏠 住宿 #${idx+1}：${h.name}</span>
  <div class="flex gap-2 text-[11px]"><button class="btn-driver-hotel text-picturebook-matcha font-bold" data-id="${h.id}">📱給司機看</button><button class="btn-edit-hotel text-picturebook-sky font-bold underline" data-id="${h.id}">編輯</button><button class="btn-del-hotel text-picturebook-muted hover:text-picturebook-sakura font-bold" data-id="${h.id}">刪除</button></div></div>
  <div class="text-xs space-y-1.5 text-picturebook-ink"><div><span class="text-picturebook-muted font-bold block">地址 (方便導航/搭車)：</span><span class="font-bold block mt-0.5 bg-picturebook-cream/60 p-2 rounded-xl border border-picturebook-border">${h.address||'未設定地址'}</span></div>
  ${h.code?`<div class="flex justify-between items-center bg-picturebook-sakura/10 p-2 rounded-xl border border-picturebook-sakura/30"><span class="text-picturebook-sakura font-bold">🔑 大門/房間密碼：</span><span class="font-bold text-sm text-picturebook-sakura">${h.code}</span></div>`:''}
  ${h.notes?`<div><span class="text-picturebook-muted font-bold block">入住須知/備註：</span><span class="text-picturebook-muted block mt-0.5">${h.notes}</span></div>`:''}</div>`;list.appendChild(c)});
 list.querySelectorAll('.btn-driver-hotel').forEach(b=>b.addEventListener('click',e=>{const x=appData.hotels.find(i=>i.id===Number(e.currentTarget.dataset.id));if(x)showDriverCard(x.name,x.local,x.address)}));
 list.querySelectorAll('.btn-edit-hotel').forEach(b=>b.addEventListener('click',e=>editHotelInfo(Number(e.currentTarget.dataset.id))));
 list.querySelectorAll('.btn-del-hotel').forEach(b=>b.addEventListener('click',e=>deleteHotelInfo(Number(e.currentTarget.dataset.id))))}
function hotelForm(h){
 askForm(h?'✏️ 修改住宿':'🏠 新增住宿',[{k:'name',label:'飯店/包棟名稱',value:h?h.name:''},{k:'address',label:'地址 (方便導航/搭車)',value:h?h.address:''},{k:'local',label:'當地文字名稱/地址（給司機看，可留空）',value:h?h.local:''},{k:'code',label:'大門/房間密碼 (可留空)',value:h?h.code:''},{k:'notes',label:'入住須知/備註',type:'textarea',value:h?h.notes:''}],v=>{
  if(!v.name){alert('請輸入名稱');return false}
  if(h)Object.assign(h,v);else appData.hotels.push({id:Date.now(),...v});
  saveData();renderHotelsList()})}
function addHotelInfo(){hotelForm(null)}
function editHotelInfo(id){const h=appData.hotels.find(x=>x.id===id);if(h)hotelForm(h)}
function deleteHotelInfo(id){if(confirm("確定要刪除這間住宿資訊嗎？")){tomb(id);appData.hotels=appData.hotels.filter(h=>h.id!==id);saveData();renderHotelsList()}}
function calculateTax(){
 const input=parseFloat(document.getElementById('input-tax-calc').value);
 const curr=document.getElementById('select-tax-currency').value;
 if(isNaN(input)||input<=0){alert('請輸入有效的金額');return}
 // 優先用線上匯率表，其次用 header 設定，最後才用預設值
 const rate=rateOf(curr)||((curr===appData.fxCode)?appData.fxRate:0.21);
 const jp=curr==='JPY';
 document.getElementById('res-tax-8').previousElementSibling.innerText=jp?'含稅 8% (食品)':'含稅 8% (日本稅率)';
 document.getElementById('res-tax-10').previousElementSibling.innerText=jp?'含稅 10% (標準)':'含稅 10% (日本稅率)';
 const v=[Math.round(input),Math.round(input*1.08),Math.round(input*1.10)];
 [['free',0],['8',1],['10',2]].forEach(([k,i])=>{
  document.getElementById('res-tax-'+k).innerText=`${v[i].toLocaleString()} ${curr}`;
  document.getElementById('res-tax-'+k+'-twd').innerText=`≈ NT$ ${Math.round(v[i]*rate).toLocaleString()}`});
 document.getElementById('tax-calc-results').classList.remove('hidden')}
function editFlightInfo(){
 askForm('✈️ 航班與租車',[{k:'g',label:'去程航班',value:appData.flightGo},{k:'b',label:'回程航班',value:appData.flightBack},{k:'r',label:'租車預約資訊',value:appData.rentalInfo}],v=>{
  appData.flightGo=v.g;appData.flightBack=v.b;appData.rentalInfo=v.r;saveData();renderToolbox()})}
</script>

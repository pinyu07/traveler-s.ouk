    <script>
        const CATEGORIES = [
            { name: "美食", icon: "🍱", bg: "bg-picturebook-sakura/20 text-picturebook-sakura" },
            { name: "觀光", icon: "⛩️", bg: "bg-picturebook-mustard/20 text-picturebook-mustard" },
            { name: "交通", icon: "🚃", bg: "bg-picturebook-sky/20 text-picturebook-sky" },
            { name: "購物", icon: "🛍️", bg: "bg-picturebook-sakura/20 text-picturebook-sakura" },
            { name: "其他", icon: "🎈", bg: "bg-picturebook-cream text-picturebook-ink" }
        ];

        const FLAG_MAP = {
            "日本": "🇯🇵", "韓國": "🇰🇷", "泰國": "🇹🇭", "越南": "🇻🇳", 
            "新加坡": "🇸🇬", "馬來西亞": "🇲🇾", "美國": "🇺🇸", "英國": "🇬🇧", 
            "法國": "🇫🇷", "義大利": "🇮🇹", "德國": "🇩🇪", "加拿大": "🇨🇦", 
            "澳洲": "🇦🇺", "紐西蘭": "🇳🇿", "香港": "🇭🇰", "澳門": "🇲🇴"
        };

        let selectedCategory = CATEGORIES[0];
        let editingItemId = null;
        let appData = {
            title: "關東秋季自由行 🍁", 
            destination: "東京/日本", 
            startDate: "2026-10-15", 
            totalDays: 5,
            weatherText: "🍂 18°C ~ 22°C 晴時多雲",
            fxCode: "JPY", 
            fxRate: 0.210, 
            companions: ["我", "夥伴A", "夥伴B"], 
            selectedDay: 1,
            itinerary: [
                { id: 1, day: 1, time: "09:00", title: "抵達羽田機場", icon: "🚃", tag: "交通", tagBg: "bg-picturebook-sky/20 text-picturebook-sky", note: "搭乘單軌電車", completed: false, mapUrl: "https://www.google.com/maps/search/?api=1&query=羽田機場" }
            ],
            spots: [{ id: 1, name: "SHIBUYA SKY", desc: "看夜景", mapUrl: "https://www.google.com/maps/search/?api=1&query=SHIBUYA+SKY" }],
            expenses: [
                { id: 1, title: "景點門票聯票", amount: 12000, payer: "夥伴A", sharedBy: ["我", "夥伴A", "夥伴B"] },
                { id: 2, title: "居酒屋美味晚餐", amount: 6000, payer: "我", sharedBy: ["我", "夥伴A", "夥伴B"] }
            ],
            checklist: [{ id: 1, text: "護照與簽證文件", checked: true }]
        };

        window.addEventListener('DOMContentLoaded', () => {
            try {
                loadLocalData();
                renderHeader();
                renderDaysSlider();
                renderItinerary();
                renderSpots();
                renderCompanions();
                renderExpenses();
                calculateSettlement();
                renderChecklist();
                renderCategorySelector();
                initEventListeners();
            } catch(e) {
                console.error("初始化錯誤:", e);
            }
        });

        function safeBind(id, event, handler) {
            const el = document.getElementById(id);
            if (el) {
                el.addEventListener(event, handler);
            }
        }

        function initEventListeners() {
            safeBind('btn-edit-title', 'click', openTripTitleEditModal);
            safeBind('trip-dest-badge', 'click', openTripTitleEditModal);
            safeBind('trip-dates-text', 'click', openTripDatesEditModal);
            safeBind('card-weather-edit', 'click', editWeather);
            safeBind('card-fx-edit', 'click', editFxRate);
            safeBind('btn-share', 'click', shareTripUrl);
            safeBind('btn-add-item', 'click', openAddItemModal);
            safeBind('btn-add-spot', 'click', openAddSpotModal);
            safeBind('btn-manage-companions', 'click', manageCompanions);
            safeBind('btn-calc-settlement', 'click', calculateSettlement);
            safeBind('btn-add-expense', 'click', openAddExpenseModal);
            safeBind('btn-add-checklist', 'click', addChecklistItem);
            safeBind('btn-close-modal', 'click', closeAddItemModal);
            safeBind('btn-save-item', 'click', saveItineraryItem);

            safeBind('nav-itinerary', 'click', () => switchTab('itinerary'));
            safeBind('nav-spots', 'click', () => switchTab('spots'));
            safeBind('nav-expenses', 'click', () => switchTab('expenses'));
            safeBind('nav-checklist', 'click', () => switchTab('checklist'));
        }

        function saveData() { 
            try { localStorage.setItem('picturebook_travel_app_v23', JSON.stringify(appData)); } catch(e){} 
        }
        function loadLocalData() {
            const saved = localStorage.getItem('picturebook_travel_app_v23');
            if (saved) { try { appData = JSON.parse(saved); } catch (e) {} }
        }

        function shareTripUrl() {
            try {
                const jsonStr = JSON.stringify(appData);
                const base64Data = btoa(encodeURIComponent(jsonStr));
                const longUrl = `${window.location.origin}${window.location.pathname}#data=${base64Data}`;
                navigator.clipboard.writeText(longUrl).then(() => {
                    alert('🔗 分享連結已複製到剪貼簿！');
                }).catch(() => {
                    prompt('請複製以下連結:', longUrl);
                });
            } catch(e) {
                alert('產生連結失敗');
            }
        }

        function getFlagEmoji(destStr) {
            for (let country in FLAG_MAP) {
                if (destStr.includes(country)) return FLAG_MAP[country];
            }
            return "✈️";
        }

        function renderHeader() {
            const t = document.getElementById('trip-title');
            if(t) t.innerText = appData.title;
            
            const b = document.getElementById('trip-dest-badge');
            if(b) {
                const flag = getFlagEmoji(appData.destination);
                b.innerText = `${flag} ${appData.destination}`;
            }

            const weatherEl = document.getElementById('header-weather');
            if(weatherEl) weatherEl.innerText = appData.weatherText || "☀️ 20°C ~ 25°C 晴天";

            const fxLabel = document.getElementById('fx-label');
            if(fxLabel) fxLabel.innerText = `匯率換算 (1 ${appData.fxCode})`;

            const fxRateEl = document.getElementById('header-fx');
            if(fxRateEl) fxRateEl.innerText = `約 ${appData.fxRate} TWD`;
            
            const dates = document.getElementById('trip-dates-text');
            if(dates) {
                const start = new Date(appData.startDate);
                const end = new Date(start);
                end.setDate(start.getDate() + (appData.totalDays - 1));
                dates.innerHTML = `<i class="fa-regular fa-calendar-check mr-1 text-picturebook-sky"></i>${start.getFullYear()}/${start.getMonth()+1}/${start.getDate()} - ${end.getFullYear()}/${end.getMonth()+1}/${end.getDate()} (${appData.totalDays}天) <i class="fa-solid fa-pen-to-square text-[10px] ml-1"></i>`;
            }
        }

        function editWeather() {
            const newWeather = prompt("請輸入預估天氣狀態:", appData.weatherText || "🍂 18°C ~ 22°C 晴時多雲");
            if (newWeather !== null && newWeather.trim() !== "") {
                appData.weatherText = newWeather.trim();
                saveData();
                renderHeader();
            }
        }

        function editFxRate() {
            const code = prompt("請輸入貨幣代碼 (例如 JPY, KRW, USD, THB):", appData.fxCode || "JPY");
            if (code !== null && code.trim() !== "") appData.fxCode = code.trim().toUpperCase();

            const rateStr = prompt(`請輸入 1 ${appData.fxCode} 換算台幣 (TWD) 的匯率:`, appData.fxRate || "0.210");
            const rate = parseFloat(rateStr);
            if (!isNaN(rate) && rate > 0) appData.fxRate = rate;

            saveData();
            renderHeader();
            renderExpenses();
            calculateSettlement();
        }

        function openTripTitleEditModal() {
            const title = prompt("請輸入新的旅程名稱:", appData.title);
            if (title !== null && title.trim() !== "") appData.title = title.trim();
            const dest = prompt("請輸入新的目的地 (例如: 大阪/日本, 首爾/韓國):", appData.destination);
            if (dest !== null && dest.trim() !== "") appData.destination = dest.trim();
            saveData();
            renderHeader();
        }

        function openTripDatesEditModal() {
            const startDate = prompt("請輸入開始日期 (格式 YYYY-MM-DD):", appData.startDate);
            if (startDate !== null && startDate.trim() !== "") appData.startDate = startDate.trim();
            const days = parseInt(prompt("請輸入總天數:", appData.totalDays));
            if (!isNaN(days) && days > 0) appData.totalDays = days;
            saveData();
            renderHeader();
            renderDaysSlider();
            renderItinerary();
        }

        function renderDaysSlider() {
            const slider = document.getElementById('day-slider');
            if(!slider) return;
            slider.innerHTML = '';
            for (let i = 1; i <= appData.totalDays; i++) {
                const dayDate = new Date(appData.startDate);
                dayDate.setDate(dayDate.getDate() + (i - 1));
                const dateStr = `${dayDate.getMonth()+1}/${dayDate.getDate()}`;
                const isActive = appData.selectedDay === i;
                const btn = document.createElement('button');
                btn.className = `flex-shrink-0 px-3.5 py-1.5 hand-card-sm text-center transition ${isActive ? 'bg-picturebook-sky text-white font-bold border-picturebook-sky shadow-sm' : 'bg-picturebook-card text-picturebook-ink'}`;
                btn.addEventListener('click', () => { appData.selectedDay = i; renderDaysSlider(); renderItinerary(); });
                btn.innerHTML = `<div class="text-[10px] ${isActive ? 'text-white/90' : 'text-picturebook-muted'}">Day ${i}</div><div class="text-xs font-bold">${dateStr}</div>`;
                slider.appendChild(btn);
            }
        }

        function renderItinerary() {
            const list = document.getElementById('timeline-list');
            if(!list) return;
            list.innerHTML = '';
            const dayItems = appData.itinerary.filter(item => item.day === appData.selectedDay);

            dayItems.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = "relative flex items-start gap-3 group";
                card.innerHTML = `
                    <div class="absolute -left-[30px] top-1 w-7 h-7 bg-picturebook-card border-2 border-picturebook-border rounded-full flex items-center justify-center text-xs shadow-sm z-20">
                        ${item.icon || '📌'}
                    </div>
                    <div class="bg-picturebook-card p-3.5 hand-card flex-1 flex items-start gap-2.5 relative">
                        <div class="flex-1">
                            <div class="flex justify-between items-center">
                                <span class="text-xs font-bold text-picturebook-mustard">${item.time}</span>
                                <span class="text-[10px] ${item.tagBg || 'bg-picturebook-cream text-picturebook-ink'} px-2.5 py-0.5 rounded-full font-bold">${item.tag || '行程'}</span>
                            </div>
                            <h4 class="text-sm font-bold text-picturebook-ink mt-0.5">${item.title}</h4>
                            <p class="text-xs text-picturebook-muted mt-1">${item.note || ''}</p>
                        </div>
                        <div class="flex flex-col items-center gap-1.5 border-l border-picturebook-border/60 pl-2">
                            <div class="flex gap-1.5 bg-picturebook-bg p-1 rounded-lg border border-picturebook-border">
                                <button class="btn-move-up text-picturebook-ink text-xs px-1 ${index === 0 ? 'opacity-20' : ''}" data-id="${item.id}" title="往上移"><i class="fa-solid fa-arrow-up"></i></button>
                                <button class="btn-move-down text-picturebook-ink text-xs px-1 ${index === dayItems.length - 1 ? 'opacity-20' : ''}" data-id="${item.id}" title="往下移"><i class="fa-solid fa-arrow-down"></i></button>
                            </div>
                            <div class="flex gap-1.5 bg-picturebook-bg p-1 rounded-lg border border-picturebook-border">
                                <button class="btn-edit-item text-picturebook-sky text-xs px-1" data-id="${item.id}" title="編輯"><i class="fa-solid fa-pen"></i></button>
                                <a href="${item.mapUrl || 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(item.title)}" target="_blank" class="text-picturebook-mustard text-xs px-1" title="地圖導航"><i class="fa-solid fa-location-dot"></i></a>
                                <button class="btn-del-item text-picturebook-muted hover:text-picturebook-sakura text-xs px-1" data-id="${item.id}" title="刪除"><i class="fa-solid fa-trash-can"></i></button>
                            </div>
                        </div>
                    </div>
                `;
                list.appendChild(card);
            });

            if (dayItems.length === 0) list.innerHTML = `<div class="text-center py-8 text-xs text-picturebook-muted">今天尚無行程</div>`;

            list.querySelectorAll('.btn-move-up').forEach(btn => btn.addEventListener('click', (e) => moveItineraryItem(Number(e.currentTarget.dataset.id), 'up')));
            list.querySelectorAll('.btn-move-down').forEach(btn => btn.addEventListener('click', (e) => moveItineraryItem(Number(e.currentTarget.dataset.id), 'down')));
            list.querySelectorAll('.btn-edit-item').forEach(btn => btn.addEventListener('click', (e) => openEditItemModal(Number(e.currentTarget.dataset.id))));
            list.querySelectorAll('.btn-del-item').forEach(btn => btn.addEventListener('click', (e) => deleteItineraryItem(Number(e.currentTarget.dataset.id))));
        }

        function moveItineraryItem(id, direction) {
            const dayItems = appData.itinerary.filter(item => item.day === appData.selectedDay);
            const index = dayItems.findIndex(item => item.id === id);
            if (index === -1) return;
            if (direction === 'up' && index > 0) {
                const target = dayItems[index - 1];
                const r1 = appData.itinerary.findIndex(i => i.id === id);
                const r2 = appData.itinerary.findIndex(i => i.id === target.id);
                [appData.itinerary[r1], appData.itinerary[r2]] = [appData.itinerary[r2], appData.itinerary[r1]];
            } else if (direction === 'down' && index < dayItems.length - 1) {
                const target = dayItems[index + 1];
                const r1 = appData.itinerary.findIndex(i => i.id === id);
                const r2 = appData.itinerary.findIndex(i => i.id === target.id);
                [appData.itinerary[r1], appData.itinerary[r2]] = [appData.itinerary[r2], appData.itinerary[r1]];
            }
            saveData(); renderItinerary();
        }

        function deleteItineraryItem(id) { appData.itinerary = appData.itinerary.filter(i => i.id !== id); saveData(); renderItinerary(); }
        
        function openAddItemModal() {
            editingItemId = null;
            document.getElementById('modal-itinerary-title').innerText = "✏️ 新增行程與交通";
            document.getElementById('input-item-title').value = '';
            document.getElementById('input-item-time').value = '10:00';
            document.getElementById('input-item-note').value = '';
            document.getElementById('modal-add-item').classList.remove('hidden');
        }

        function openEditItemModal(id) {
            editingItemId = id;
            const item = appData.itinerary.find(i => i.id === id);
            if (item) {
                document.getElementById('modal-itinerary-title').innerText = "✏️ 編輯行程與地點";
                document.getElementById('input-item-title').value = item.title;
                document.getElementById('input-item-time').value = item.time;
                document.getElementById('input-item-note').value = item.note || '';
                const cat = CATEGORIES.find(c => c.name === item.tag) || CATEGORIES[0];
                selectedCategory = cat;
            }
            document.getElementById('modal-add-item').classList.remove('hidden');
        }

        function closeAddItemModal() { document.getElementById('modal-add-item').classList.add('hidden'); }
        
        function saveItineraryItem() {
            const title = document.getElementById('input-item-title').value.trim();
            if (!title) { alert('請輸入標題'); return; }
            const time = document.getElementById('input-item-time').value.trim() || '10:00';
            const note = document.getElementById('input-item-note').value.trim() || '';
            const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(title)}`;

            if (editingItemId) {
                const item = appData.itinerary.find(i => i.id === editingItemId);
                if (item) {
                    item.title = title;
                    item.time = time;
                    item.note = note;
                    item.icon = selectedCategory.icon;
                    item.tag = selectedCategory.name;
                    item.tagBg = selectedCategory.bg;
                    item.mapUrl = mapUrl;
                }
            } else {
                appData.itinerary.push({
                    id: Date.now(), day: appData.selectedDay, time, title,
                    icon: selectedCategory.icon, tag: selectedCategory.name, tagBg: selectedCategory.bg,
                    note, completed: false, mapUrl
                });
            }
            saveData(); renderItinerary(); closeAddItemModal();
        }

        function renderCategorySelector() {
            const c = document.getElementById('category-selector');
            if(!c) return;
            c.innerHTML = '';
            CATEGORIES.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = "p-2 rounded-xl border flex flex-col items-center gap-1 bg-white text-xs";
                btn.addEventListener('click', () => { selectedCategory = cat; });
                btn.innerHTML = `<span>${cat.icon}</span><span>${cat.name}</span>`;
                c.appendChild(btn);
            });
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            const target = document.getElementById(`tab-${tab}`);
            if(target) target.classList.remove('hidden');

            document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('text-picturebook-sky', 'tab-active'));
            const navBtn = document.getElementById(`nav-${tab}`);
            if(navBtn) navBtn.classList.add('text-picturebook-sky', 'tab-active');
        }

        function renderSpots() {
            const list = document.getElementById('spots-list');
            if(!list) return;
            list.innerHTML = '';
            appData.spots.forEach(spot => {
                const card = document.createElement('div');
                card.className = "bg-picturebook-card p-3.5 hand-card flex flex-col justify-between";
                card.innerHTML = `<div><h4 class="text-xs font-bold text-picturebook-ink">${spot.name}</h4><p class="text-[11px] text-picturebook-muted mt-1">${spot.desc}</p></div>
                <div class="mt-3 flex justify-between items-center border-t border-picturebook-border pt-2"><a href="${spot.mapUrl || 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(spot.name)}" target="_blank" class="text-[11px] text-picturebook-mustard font-bold"><i class="fa-solid fa-map-pin mr-1"></i>導航</a><button class="btn-del-spot text-[11px] text-picturebook-muted hover:text-picturebook-sakura" data-id="${spot.id}"><i class="fa-solid fa-trash-can"></i></button></div>`;
                list.appendChild(card);
            });
            list.querySelectorAll('.btn-del-spot').forEach(btn => btn.addEventListener('click', (e) => deleteSpot(Number(e.currentTarget.dataset.id))));
        }

        function openAddSpotModal() {
            const name = prompt("景點名稱:");
            if (!name) return;
            const desc = prompt("筆記:", "") || "";
            appData.spots.push({ id: Date.now(), name, desc, mapUrl: `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name)}` });
            saveData(); renderSpots();
        }

        function deleteSpot(id) { appData.spots = appData.spots.filter(s => s.id !== id); saveData(); renderSpots(); }

        function renderCompanions() {
            const container = document.getElementById('companions-chips');
            if(!container) return;
            container.innerHTML = '';
            appData.companions.forEach(c => {
                const chip = document.createElement('span');
                chip.className = "bg-picturebook-sakura/15 text-picturebook-sakura px-2.5 py-1 rounded-full border border-picturebook-sakura/30 font-bold";
                chip.innerText = c;
                container.appendChild(chip);
            });
        }

        function manageCompanions() {
            const input = prompt("請輸入同行成員，用逗號分開:", appData.companions.join(', '));
            if (input) {
                appData.companions = input.split(',').map(s => s.trim()).filter(s => s.length > 0);
                saveData(); renderCompanions(); calculateSettlement();
            }
        }

        function renderExpenses() {
            const list = document.getElementById('expenses-list');
            if(!list) return;
            list.innerHTML = '';
            appData.expenses.forEach(item => {
                const twdValue = Math.round(item.amount * (appData.fxRate || 1));
                const card = document.createElement('div');
                card.className = "bg-picturebook-card p-3.5 hand-card flex justify-between items-center";
                card.innerHTML = `
                    <div class="flex-1">
                        <div class="text-xs font-bold text-picturebook-ink">${item.title}</div>
                        <div class="text-[10px] text-picturebook-muted mt-0.5"><span class="text-picturebook-sakura font-bold">${item.payer}</span> 掏錢 ｜ 平分: ${item.sharedBy.join(', ')}</div>
                    </div>
                    <div class="text-right mr-3">
                        <div class="text-xs font-bold text-picturebook-ink">${item.amount.toLocaleString()} ${appData.fxCode}</div>
                        <div class="text-[10px] text-picturebook-muted font-bold">(約 NT$ ${twdValue.toLocaleString()})</div>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <button class="btn-edit-exp text-picturebook-sky hover:text-picturebook-ink text-xs p-1" data-id="${item.id}" title="修改"><i class="fa-solid fa-pen"></i></button>
                        <button class="btn-del-exp text-picturebook-muted hover:text-picturebook-sakura text-xs p-1" data-id="${item.id}" title="刪除"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                `;
                list.appendChild(card);
            });
            if(appData.expenses.length === 0) list.innerHTML = `<div class="text-center py-4 text-xs text-picturebook-muted">目前尚無消費紀錄</div>`;

            list.querySelectorAll('.btn-edit-exp').forEach(btn => btn.addEventListener('click', (e) => editExpense(Number(e.currentTarget.dataset.id))));
            list.querySelectorAll('.btn-del-exp').forEach(btn => btn.addEventListener('click', (e) => deleteExpense(Number(e.currentTarget.dataset.id))));
        }

        function openAddExpenseModal() {
            const title = prompt("品項名稱 (例如: 居酒屋晚餐):");
            if (!title) return;
            const amount = parseFloat(prompt(`金額 (${appData.fxCode}):`, "3000"));
            if (isNaN(amount)) return;
            const payer = prompt(`誰先掏錢墊付？ (${appData.companions.join('/')}):`, appData.companions[0]) || appData.companions[0];
            const sharersInput = prompt(`誰要平分這筆錢？(用逗號分開):`, appData.companions.join(','));
            const sharedBy = sharersInput ? sharersInput.split(',').map(s => s.trim()) : [...appData.companions];

            appData.expenses.push({ id: Date.now(), title, amount, payer, sharedBy });
            saveData(); renderExpenses(); calculateSettlement();
        }

        function editExpense(id) {
            const item = appData.expenses.find(e => e.id === id);
            if (!item) return;
            const title = prompt("修改品項名稱:", item.title);
            if (!title) return;
            const amount = parseFloat(prompt(`修改金額 (${appData.fxCode}):`, item.amount));
            if (isNaN(amount)) return;
            const payer = prompt(`誰先掏錢墊付？ (${appData.companions.join('/')}):`, item.payer) || item.payer;
            const sharersInput = prompt(`誰要平分這筆錢？(用逗號分開):`, item.sharedBy.join(','));
            const sharedBy = sharersInput ? sharersInput.split(',').map(s => s.trim()) : [...appData.companions];

            item.title = title;
            item.amount = amount;
            item.payer = payer;
            item.sharedBy = sharedBy;
            saveData(); renderExpenses(); calculateSettlement();
        }

        function deleteExpense(id) {
            appData.expenses = appData.expenses.filter(e => e.id !== id);
            saveData(); renderExpenses(); calculateSettlement();
        }

        function calculateSettlement() {
            const bdContainer = document.getElementById('settlement-breakdown');
            const actContainer = document.getElementById('settlement-actions');
            if(!bdContainer || !actContainer) return;
            bdContainer.innerHTML = ''; actContainer.innerHTML = '';

            if (appData.expenses.length === 0) {
                bdContainer.innerHTML = `<div class="text-picturebook-muted">目前尚未記錄任何支出</div>`;
                return;
            }

            let totalSpent = 0;
            let paidMap = {};
            let oweMap = {};
            let persons = appData.companions;
            let pairwise = {};

            persons.forEach(p1 => {
                paidMap[p1] = 0;
                oweMap[p1] = 0;
                pairwise[p1] = {};
                persons.forEach(p2 => { if (p1 !== p2) pairwise[p1][p2] = 0; });
            });

            appData.expenses.forEach(exp => {
                totalSpent += exp.amount;
                if (paidMap[exp.payer] !== undefined) paidMap[exp.payer] += exp.amount;

                const validSharers = exp.sharedBy.filter(s => persons.includes(s));
                const shareCount = validSharers.length || 1;
                const perPersonShare = exp.amount / shareCount;

                validSharers.forEach(sharer => {
                    if (oweMap[sharer] !== undefined) oweMap[sharer] += perPersonShare;
                    if (sharer !== exp.payer && pairwise[sharer] && pairwise[sharer][exp.payer] !== undefined) {
                        pairwise[sharer][exp.payer] += perPersonShare;
                    }
                });
            });

            const totalTwd = Math.round(totalSpent * (appData.fxRate || 1));
            bdContainer.innerHTML = `<div class="flex justify-between items-center font-bold border-b border-picturebook-border pb-1.5 mb-2">
                <span>全團總支出:</span>
                <div class="text-right">
                    <span class="text-picturebook-sakura font-bold">${Math.round(totalSpent).toLocaleString()} ${appData.fxCode}</span>
                    <span class="text-[10px] text-picturebook-muted block font-normal">(約 NT$ ${totalTwd.toLocaleString()})</span>
                </div>
            </div>`;
            
            persons.forEach(person => {
                const paid = paidMap[person] || 0;
                const owe = oweMap[person] || 0;
                const net = paid - owe;

                const row = document.createElement('div');
                row.className = "flex justify-between items-center text-[11px] mb-1";
                row.innerHTML = `<span><strong>${person}</strong> (已墊: ${Math.round(paid)} / 應付: ${Math.round(owe)})</span>
                <span class="${net >= 0 ? 'text-picturebook-matcha font-bold' : 'text-picturebook-sakura font-bold'}">${net >= 0 ? '淨收 +' : '淨付 '}${Math.round(net)} ${appData.fxCode}</span>`;
                bdContainer.appendChild(row);
            });

            let netPairs = [];
            let checkedPairs = new Set();

            persons.forEach(p1 => {
                persons.forEach(p2 => {
                    if (p1 !== p2 && !checkedPairs.has(`${p2}-${p1}`)) {
                        checkedPairs.add(`${p1}-${p2}`);
                        let p1_owes_p2 = pairwise[p1][p2] || 0;
                        let p2_owes_p1 = pairwise[p2][p1] || 0;
                        let diff = p1_owes_p2 - p2_owes_p1;
                        if (diff > 1) {
                            netPairs.push({ debtor: p1, creditor: p2, amount: diff });
                        } else if (diff < -1) {
                            netPairs.push({ debtor: p2, creditor: p1, amount: Math.abs(diff) });
                        }
                    }
                });
            });

            actContainer.innerHTML = `<div class="text-[11px] font-bold text-picturebook-ink mb-1 mt-2">🤝 直接轉帳對帳清單：</div>`;

            if (netPairs.length === 0) {
                actContainer.innerHTML += `<div class="text-picturebook-matcha font-bold mt-1">✨ 大家帳目剛好平衡，無須互相轉帳！</div>`;
            } else {
                netPairs.forEach(item => {
                    const twdVal = Math.round(item.amount * (appData.fxRate || 1));
                    const div = document.createElement('div');
                    div.className = "bg-white p-2.5 rounded-xl border border-picturebook-border flex items-center justify-between text-picturebook-ink shadow-sm mb-1.5";
                    div.innerHTML = `
                        <span>💳 <strong class="text-picturebook-sakura">${item.debtor}</strong> 應付給 <strong class="text-picturebook-sky">${item.creditor}</strong></span>
                        <div class="text-right">
                            <span class="text-picturebook-sakura font-bold">${Math.round(item.amount).toLocaleString()} ${appData.fxCode}</span>
                            <span class="text-[9px] text-picturebook-muted block font-normal">(約 NT$ ${twdVal.toLocaleString()})</span>
                        </div>
                    `;
                    actContainer.appendChild(div);
                });
            }
        }

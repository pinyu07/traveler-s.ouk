<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日系手帳風旅遊與分帳 App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        picturebook: {
                            bg: '#FFFDF9', card: '#FFFFFF', cream: '#FFF7E6', matcha: '#859F7A',
                            sakura: '#E8A5A5', mustard: '#E0A949', sky: '#81A3BD',
                            lightYellow: '#FDF6E2', lightBlue: '#E6F0F7', ink: '#4A3E3D',
                            muted: '#A0938E', border: '#E8E1D7'
                        }
                    },
                    fontFamily: { hand: ['"Zen Maru Gothic"', 'sans-serif'], title: ['"Mochiy Pop One"', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { background-color: #FFFDF9; color: #4A3E3D; font-family: 'Zen Maru Gothic', sans-serif; -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .hand-card { border-radius: 18px 14px 20px 16px; border: 2px solid #E8E1D7; box-shadow: 3px 3px 0px #E8E1D7; }
        .hand-card-sm { border-radius: 14px 12px 15px 11px; border: 2px solid #E8E1D7; }
        .hand-btn { border-radius: 12px 14px 11px 13px; box-shadow: 2px 2px 0px #4A3E3D; transition: all 0.1s ease; cursor: pointer; }
        .hand-btn:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0px #4A3E3D; }
        .tab-active { color: #81A3BD; border-bottom: 3px solid #81A3BD; font-weight: 700; }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen flex flex-col justify-between relative shadow-2xl bg-picturebook-bg">

    <!-- Header -->
    <header class="bg-gradient-to-r from-picturebook-lightYellow via-picturebook-cream to-picturebook-lightBlue text-picturebook-ink p-5 rounded-b-[28px] shadow-sm relative overflow-hidden border-b-2 border-picturebook-border">
        <div class="flex justify-between items-start relative z-10">
            <div class="w-full">
                <div class="flex items-center justify-between">
                    <span id="trip-dest-badge" class="bg-white/80 text-picturebook-ink text-xs px-3 py-1 rounded-full font-bold border border-picturebook-border shadow-sm cursor-pointer hover:bg-white" title="點擊編輯目的地">🇯🇵 東京/日本</span>
                    <div class="flex gap-1.5">
                        <button id="btn-edit-title" class="text-[11px] bg-white text-picturebook-sky px-2.5 py-1 hand-btn font-bold border border-picturebook-border flex items-center gap-1">
                            <i class="fa-solid fa-pen"></i> 更改標題
                        </button>
                        <button id="btn-share" class="text-[10px] bg-picturebook-matcha text-white px-2.5 py-1 hand-btn font-bold">
                            <i class="fa-solid fa-share-nodes mr-1"></i>分享
                        </button>
                    </div>
                </div>
                
                <div class="mt-2">
                    <h1 id="trip-title" class="text-2xl font-title text-picturebook-ink">關東秋季自由行 🍁</h1>
                </div>
                
                <p id="trip-dates-text" class="text-xs text-picturebook-muted mt-1 font-bold cursor-pointer hover:text-picturebook-sky transition inline-block">
                    <i class="fa-regular fa-calendar-check mr-1 text-picturebook-sky"></i>2026/10/15 - 2026/10/19 (5天) <i class="fa-solid fa-pen-to-square text-[10px] ml-1"></i>
                </p>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-2 mt-4 pt-3 border-t border-picturebook-border/60 text-xs">
            <div id="card-weather-edit" class="bg-white/80 p-2 rounded-xl border border-picturebook-border flex items-center justify-between cursor-pointer hover:bg-white transition" title="點擊修改天氣">
                <div>
                    <div class="text-[10px] text-picturebook-muted font-bold flex items-center gap-1">預估天氣 <i class="fa-solid fa-pen text-[9px]"></i></div>
                    <div class="font-bold text-picturebook-ink" id="header-weather">🍂 18°C ~ 22°C 晴時多雲</div>
                </div>
                <i class="fa-solid fa-cloud-sun text-picturebook-mustard text-lg"></i>
            </div>
            <div id="card-fx-edit" class="bg-white/80 p-2 rounded-xl border border-picturebook-border flex items-center justify-between cursor-pointer hover:bg-white transition" title="點擊修改匯率">
                <div>
                    <div class="text-[10px] text-picturebook-muted font-bold flex items-center gap-1"><span id="fx-label">匯率換算 (1 JPY)</span> <i class="fa-solid fa-pen text-[9px]"></i></div>
                    <div class="font-bold text-picturebook-sakura" id="header-fx">約 0.210 TWD</div>
                </div>
                <i class="fa-solid fa-coins text-picturebook-sakura text-lg"></i>
            </div>
        </div>
    </header>

    <!-- Day Slider -->
    <div class="px-4 mt-3">
        <div id="day-slider" class="flex gap-2 overflow-x-auto hide-scrollbar py-1"></div>
    </div>

    <!-- Main Content -->
    <main class="flex-1 px-4 py-2 pb-24 overflow-y-auto">
        <!-- TAB 1: ITINERARY -->
        <div id="tab-itinerary" class="tab-content space-y-3">
            <div class="flex justify-between items-center px-1 pt-1">
                <h2 class="font-bold text-picturebook-ink text-sm"><i class="fa-solid fa-list-ul text-picturebook-sky mr-1.5"></i>行程時間軸</h2>
                <button id="btn-add-item" class="text-xs bg-picturebook-sky text-white px-3.5 py-2 hand-btn font-bold">✏️ 新增行程</button>
            </div>
            <div class="relative pl-8 pt-3 space-y-4">
                <div class="absolute left-[15px] top-4 bottom-4 w-0 border-l-2 border-dashed border-picturebook-muted/50 z-0"></div>
                <div id="timeline-list" class="space-y-4 relative z-10"></div>
            </div>
        </div>

        <!-- TAB 2: SPOTS -->
        <div id="tab-spots" class="tab-content hidden space-y-3">
            <div class="flex justify-between items-center mb-1">
                <h2 class="font-bold text-picturebook-ink text-sm"><i class="fa-solid fa-map-location-dot text-picturebook-mustard mr-1.5"></i>景點地圖</h2>
                <button id="btn-add-spot" class="text-xs bg-picturebook-mustard text-white px-3 py-1.5 hand-btn font-bold">+ 新增景點</button>
            </div>
            <div id="spots-list" class="grid grid-cols-2 gap-2.5"></div>
        </div>

        <!-- TAB 3: EXPENSES -->
        <div id="tab-expenses" class="tab-content hidden space-y-3">
            <div class="bg-picturebook-card p-3.5 hand-card">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs font-bold text-picturebook-ink"><i class="fa-solid fa-user-group text-picturebook-sakura mr-1.5"></i>旅途好夥伴</span>
                    <button id="btn-manage-companions" class="text-[11px] text-picturebook-sakura font-bold underline">編輯夥伴</button>
                </div>
                <div id="companions-chips" class="flex flex-wrap gap-1.5 text-xs"></div>
            </div>

            <div class="bg-picturebook-card hand-card p-4">
                <div class="flex justify-between items-center mb-2.5">
                    <span class="text-xs font-bold text-picturebook-ink"><i class="fa-solid fa-scale-balanced text-picturebook-sky mr-1.5"></i>全團結算與兩兩對帳清單</span>
                    <button id="btn-calc-settlement" class="text-[11px] bg-picturebook-sky text-white px-2.5 py-1 hand-btn font-bold">重新計算</button>
                </div>
                <div id="settlement-breakdown" class="text-xs space-y-1.5 mb-3 pb-2.5 border-b border-picturebook-border text-picturebook-ink"></div>
                <div id="settlement-actions" class="text-xs space-y-2 font-bold"></div>
            </div>

            <div class="flex justify-between items-center pt-1">
                <h3 class="text-xs font-bold text-picturebook-ink">📝 消費明細筆記</h3>
                <button id="btn-add-expense" class="bg-picturebook-sakura text-white text-xs px-3 py-1.5 hand-btn font-bold">+ 手動記一筆</button>
            </div>
            <div id="expenses-list" class="space-y-2.5"></div>
